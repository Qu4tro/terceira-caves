<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Grutas da Terceira</title>
<style>
/* ============================== tokens ============================== */
:root{
  --sea:#D5DDE0; --sea-2:#C6D0D4; --land:#EDE9E1; --land-edge:#B9C1C3;
  --paper:#F7F5F1; --paper-2:#FCFBF8;
  --ink:#14181A; --ink-2:#4C5453; --ink-3:#67706F; --rule:#C9D0D2; --hair:#DED9CF;
  --accent:#A2560F; --accent-2:#B0722C; --accent-wash:#E7D8C2; --on-accent:#FCFBF8;
  --road:#C3BCB0; --road-2:#D3CDC3;
  --shadow:0 1px 2px rgba(20,24,26,.07), 0 8px 26px rgba(20,24,26,.11);
  --sheet-shadow:0 -2px 30px rgba(20,24,26,.16);
  --f-display:ui-serif,"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --f-ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --r:7px; --sp:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --sea:#080B0D; --sea-2:#101619; --land:#15191B; --land-edge:#39423F;
    --paper:#1C2124; --paper-2:#242A2D;
    --ink:#E8EAE7; --ink-2:#9AA3A5; --ink-3:#828C8F; --rule:#2A3134; --hair:#232A2C;
    --accent:#E9A052; --accent-2:#C08A45; --accent-wash:#33291C; --on-accent:#14181A;
    --road:#31383A; --road-2:#272D2F;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 26px rgba(0,0,0,.55);
    --sheet-shadow:0 -2px 30px rgba(0,0,0,.65);
  }
}
:root[data-theme="dark"]{
  --sea:#080B0D; --sea-2:#101619; --land:#15191B; --land-edge:#39423F;
  --paper:#1C2124; --paper-2:#242A2D;
  --ink:#E8EAE7; --ink-2:#9AA3A5; --ink-3:#828C8F; --rule:#2A3134; --hair:#232A2C;
  --accent:#E9A052; --accent-2:#C08A45; --accent-wash:#33291C; --on-accent:#14181A;
  --road:#31383A; --road-2:#272D2F;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 26px rgba(0,0,0,.55);
  --sheet-shadow:0 -2px 30px rgba(0,0,0,.65);
}

/* ============================== base ============================== */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--sea); color:var(--ink);
  font-family:var(--f-ui); font-size:15px; line-height:1.5;
  -webkit-text-size-adjust:100%; overscroll-behavior:none;
}
button,input,select{font:inherit; color:inherit}
button{background:none; border:0; cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden}

/* ============================== header ============================== */
.hd{
  flex:none; display:flex; align-items:center; gap:12px;
  padding:9px 12px; background:var(--paper); border-bottom:1px solid var(--rule);
  position:relative; z-index:6;
}
.brand{display:flex; align-items:baseline; gap:9px; min-width:0}
.brand h1{
  margin:0; font-family:var(--f-display); font-size:17px; font-weight:600;
  letter-spacing:-.005em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.brand .sub{
  font-family:var(--f-mono); font-size:10px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap;
}
@media (max-width:400px){ .brand .sub{display:none} }

.seg{
  margin-left:auto; flex:none; display:flex; gap:2px; padding:2px;
  background:var(--land); border:1px solid var(--rule); border-radius:var(--r);
}
.seg button{
  padding:4px 11px; border-radius:5px; font-size:12.5px; font-weight:500;
  color:var(--ink-2); line-height:1.6;
}
.seg button[aria-pressed="true"]{background:var(--paper-2); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.10)}
.seg+.seg{margin-left:0}
.seg.lang button{padding:4px 9px; font-family:var(--f-mono); font-size:11px; letter-spacing:.06em}
@media (max-width:430px){ .seg.lang button{padding:4px 7px} }

/* ============================== controls ============================== */
.ctl{
  flex:none; display:flex; gap:8px; align-items:center;
  padding:8px 12px; background:var(--paper); border-bottom:1px solid var(--rule);
  position:relative; z-index:5;
}
.search{flex:1 1 auto; min-width:0; position:relative; display:flex; align-items:center}
.search svg{position:absolute; left:9px; width:14px; height:14px; color:var(--ink-3); pointer-events:none}
.search input{
  width:100%; padding:7px 30px 7px 28px; border:1px solid var(--rule); border-radius:var(--r);
  background:var(--paper-2); font-size:14px;
}
.search input::placeholder{color:var(--ink-3)}
.search .clr{
  position:absolute; right:4px; width:22px; height:22px; border-radius:5px;
  display:none; align-items:center; justify-content:center; color:var(--ink-3); font-size:15px;
}
.search.has .clr{display:flex}

.fbtn{
  flex:none; display:flex; align-items:center; gap:6px; padding:7px 11px;
  border:1px solid var(--rule); border-radius:var(--r); background:var(--paper-2);
  font-size:13px; color:var(--ink-2);
}
.fbtn[aria-expanded="true"]{background:var(--land); color:var(--ink)}
.fbtn .n{
  min-width:17px; height:17px; padding:0 4px; border-radius:9px; background:var(--accent);
  color:var(--on-accent); font-family:var(--f-mono); font-size:10.5px; line-height:17px;
  text-align:center; display:none;
}
.fbtn.on .n{display:inline-block}

/* ============================== filter tray ============================== */
.tray{
  position:absolute; top:100%; left:0; right:0; z-index:8;
  background:var(--paper); border-bottom:1px solid var(--rule); box-shadow:var(--shadow);
  padding:4px 12px 14px; max-height:62vh; overflow-y:auto; display:none;
}
.tray.open{display:block}
.tray h3{
  margin:14px 0 7px; font-family:var(--f-mono); font-size:10px; font-weight:500;
  letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3);
}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{
  display:inline-flex; align-items:center; gap:6px; padding:5px 11px;
  border:1px solid var(--rule); border-radius:14px; background:var(--paper-2);
  font-size:13px; color:var(--ink-2); line-height:1.4;
}
.chip .ct{font-family:var(--f-mono); font-size:10.5px; color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--paper)}
.chip[aria-pressed="true"] .ct{color:var(--paper); opacity:.65}
.chip[aria-pressed="true"] .gl svg circle[fill="var(--paper)"]{fill:var(--ink)}
.chip .gl{flex:none; display:grid; place-items:center; width:16px; height:16px; margin-left:-2px}
.tray .foot{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  margin-top:16px; padding-top:12px; border-top:1px solid var(--rule);
}
.tray .foot .cnt{font-family:var(--f-mono); font-size:12px; color:var(--ink-2)}
.tray .foot .cnt b{color:var(--ink); font-weight:600}
.linkbtn{font-size:13px; color:var(--accent); text-decoration:underline; text-underline-offset:3px}

/* ============================== main ============================== */
.main{flex:1 1 auto; min-height:0; display:flex; position:relative}
.stage{flex:1 1 auto; min-width:0; position:relative}

/* ---- map ---- */
#map{display:block; width:100%; height:100%; touch-action:none; cursor:grab; background:var(--sea)}
#map.drag{cursor:grabbing}
.mapui{position:absolute; inset:0; pointer-events:none}
.mapui>*{pointer-events:auto}

.zoom{
  position:absolute; right:10px; bottom:10px; display:flex; flex-direction:column;
  border:1px solid var(--rule); border-radius:var(--r); overflow:hidden;
  background:var(--paper); box-shadow:var(--shadow);
}
.zoom button{
  width:34px; height:32px; display:grid; place-items:center; color:var(--ink-2);
  font-size:16px; line-height:1;
}
.zoom button+button{border-top:1px solid var(--rule)}
.zoom button:active{background:var(--land)}
.zoom svg{width:14px; height:14px}
.zoom #zOsm{font-size:9px; font-weight:600; letter-spacing:.03em}

.scalebar{
  position:absolute; left:10px; bottom:10px; padding:4px 7px 3px;
  background:color-mix(in srgb, var(--paper) 80%, transparent);
  border:1px solid var(--rule); border-radius:5px;
  font-family:var(--f-mono); font-size:10px; color:var(--ink-2); letter-spacing:.02em;
}
.scalebar .bar{height:4px; border:1px solid var(--ink-2); border-top:0; margin-top:2px}

.osmattr{
  position:absolute; left:50%; transform:translateX(-50%); bottom:10px; padding:2px 7px;
  background:color-mix(in srgb, var(--paper) 80%, transparent);
  border:1px solid var(--rule); border-radius:5px; font-size:10px; color:var(--ink-2);
}
.osmattr a{color:inherit}
/* narrow viewports: the scalebar reaches past centre, so sit above it */
@media (max-width:879px){ .osmattr{bottom:45px} }

.legend{
  position:absolute; left:10px; top:10px;
  z-index:1; background:var(--paper); border:1px solid var(--rule);
  border-radius:var(--r); box-shadow:var(--shadow); font-size:12px; max-width:min(64vw,240px);
}
.legend>button{
  display:flex; align-items:center; gap:7px; width:100%; padding:7px 10px;
  font-family:var(--f-mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3);
}
.legend>button .car{transition:transform .18s}
.legend[data-open="1"]>button .car{transform:rotate(180deg)}
.legend .body{display:none; padding:0 10px 10px; border-top:1px solid var(--rule); margin-top:0}
.legend[data-open="1"] .body{display:block}
.legend .row{display:flex; align-items:center; gap:8px; padding:5px 0; color:var(--ink-2); line-height:1.3}
.legend .row .gl{flex:none; width:18px; height:18px; display:grid; place-items:center}
.legend .note{margin:6px 0 0; padding-top:7px; border-top:1px solid var(--rule); color:var(--ink-3); font-size:11px; line-height:1.45}

@media (min-width:880px){
  .legend{top:auto; bottom:52px}
}

/* ---- list ---- */
.list{position:absolute; inset:0; overflow-y:auto; background:var(--paper); -webkit-overflow-scrolling:touch}
.list .lhead{
  position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:10px;
  padding:9px 14px; background:var(--paper); border-bottom:1px solid var(--rule);
}
.list .lhead .cnt{font-family:var(--f-mono); font-size:11px; color:var(--ink-3); letter-spacing:.03em}
.list .lhead .cnt b{color:var(--ink); font-weight:600}
.sortsel{
  margin-left:auto; padding:5px 8px; border:1px solid var(--rule); border-radius:6px;
  background:var(--paper-2); font-size:12.5px; color:var(--ink-2);
}
.rows{list-style:none; margin:0; padding:0}
.rows li{border-bottom:1px solid var(--hair)}
.row{
  display:grid; grid-template-columns:22px 1fr auto; gap:10px; align-items:center;
  width:100%; padding:11px 14px; text-align:left;
}
.row:hover{background:var(--land)}
.row[aria-current="true"]{background:var(--accent-wash)}
.row .gl{display:grid; place-items:center}
.row .nm{font-family:var(--f-display); font-size:15.5px; line-height:1.25; color:var(--ink); overflow-wrap:anywhere}
.row .meta{margin-top:3px; font-size:11.5px; color:var(--ink-3); display:flex; flex-wrap:wrap; gap:5px; align-items:center}
.row .meta .sep{opacity:.5}
.row .val{text-align:right; font-family:var(--f-mono); font-size:12.5px; color:var(--ink-2); font-variant-numeric:tabular-nums; white-space:nowrap}
.row .val .u{font-size:10px; color:var(--ink-3)}
.row .bar{grid-column:2 / -1; height:3px; background:var(--hair); border-radius:2px; overflow:hidden; margin-top:7px}
.row .bar i{display:block; height:100%; background:var(--accent); border-radius:2px}
.empty{padding:44px 20px; text-align:center; color:var(--ink-3); font-size:14px}
.empty b{display:block; font-family:var(--f-display); font-size:17px; color:var(--ink-2); margin-bottom:6px}

/* ---- about block at end of list ---- */
.about{padding:20px 14px 34px; border-top:1px solid var(--rule); background:var(--land)}
.about h2{margin:0 0 9px; font-family:var(--f-mono); font-size:10px; font-weight:500; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3)}
.about p{margin:0 0 9px; font-size:12.5px; line-height:1.6; color:var(--ink-2); max-width:62ch}
.about p:last-child{margin-bottom:0}
.about b{color:var(--ink); font-weight:600}

/* ============================== sheet / rail ============================== */
.sheet{
  position:absolute; left:0; right:0; bottom:0; z-index:9;
  max-height:88%; display:flex; flex-direction:column;
  background:var(--paper); border-top:1px solid var(--rule);
  border-radius:14px 14px 0 0; box-shadow:var(--sheet-shadow);
  transform:translateY(101%); transition:transform .26s cubic-bezier(.22,.68,.36,1), visibility .26s;
  will-change:transform; visibility:hidden; min-height:180px;
}
.sheet.open{transform:translateY(0); visibility:visible}
.sheet .grab{flex:none; padding:8px 0 2px; display:grid; place-items:center; touch-action:none; cursor:grab}
.sheet .grab i{display:block; width:34px; height:4px; border-radius:2px; background:var(--rule)}
.sheet .close{
  position:absolute; right:8px; top:8px; width:30px; height:30px; border-radius:50%;
  display:grid; place-items:center; color:var(--ink-3); background:var(--land); z-index:2;
}
.sheet .close svg{width:13px; height:13px}
.sheetbody{overflow-y:auto; padding:2px 16px 22px; -webkit-overflow-scrolling:touch}

@media (min-width:880px){
  .main{gap:0}
  .rail{
    flex:0 0 384px; min-width:0; border-left:1px solid var(--rule); background:var(--paper);
    display:flex; flex-direction:column; overflow:hidden;
  }
  .sheet{
    position:static; flex:1 1 auto; max-height:none; transform:none; box-shadow:none;
    border:0; border-radius:0; transition:none; visibility:visible; min-height:0;
  }
  .sheet .grab{display:none}
  .sheet .close{display:none}
  .sheetbody{padding:16px 18px 26px}
}
@media (max-width:879px){ .rail{display:contents} }

/* ---- detail contents ---- */
.d-name{margin:6px 0 2px; font-family:var(--f-display); font-size:24px; font-weight:600; line-height:1.15; letter-spacing:-.012em; text-wrap:balance; padding-right:34px}
.d-where{font-size:12.5px; color:var(--ink-3); margin-bottom:12px}
.d-alias{font-size:12.5px; color:var(--ink-2); margin:0 0 4px; text-wrap:pretty}
.row .meta .nofix{color:var(--ink-3); font-style:italic}
.d-tags{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px}
.tag{
  display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:12px;
  border:1px solid var(--rule); background:var(--paper-2);
  font-family:var(--f-mono); font-size:10.5px; letter-spacing:.05em; color:var(--ink-2); text-transform:uppercase;
}
.tag.hi{border-color:var(--accent); color:var(--accent); background:var(--accent-wash)}
.tag .dot{width:8px; height:8px; border-radius:50%}

.stats{display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--rule); border:1px solid var(--rule); border-radius:var(--r); overflow:hidden; margin-bottom:14px}
.stat{background:var(--paper-2); padding:9px 11px}
.stat .k{font-family:var(--f-mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}
.stat .v{font-family:var(--f-display); font-size:21px; font-weight:600; line-height:1.25; font-variant-numeric:tabular-nums; margin-top:1px}
.stat .v small{font-family:var(--f-ui); font-size:11px; font-weight:400; color:var(--ink-3); margin-left:2px}
.stat .v.none{color:var(--ink-3); font-size:17px}
/* four-up variant for the official 0-5 assessment scores */
.stats.q3{grid-template-columns:repeat(3,1fr)}
.stats.q3 .v{font-size:21px}
.stats.q4{grid-template-columns:repeat(4,1fr); margin-bottom:0}
.stats.q4 .stat{padding:8px 7px}
.stats.q4 .k{font-size:8.5px; letter-spacing:.05em}
.stats.q4 .v{font-size:19px}

.plan{border:1px solid var(--rule); border-radius:var(--r); background:var(--paper-2); padding:10px; margin-bottom:14px}
.plan .cap{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:6px}
.plan .cap .t{font-family:var(--f-mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}
.plan .cap .s{font-family:var(--f-mono); font-size:10px; color:var(--ink-3)}
.plan svg{display:block; width:100%; height:auto; max-height:min(46vh,430px)}
.plan .pl{fill:none; stroke:var(--accent); stroke-width:.9; stroke-linecap:round; stroke-linejoin:round; vector-effect:non-scaling-stroke}
.plan.muted .pl{stroke:var(--ink-2)}
.plan .ax{stroke:var(--ink-3); stroke-width:1; fill:none; vector-effect:non-scaling-stroke}
.plan .axt{fill:var(--ink-3); font-family:var(--f-mono); font-size:7px}
/* the passage plots itself in, top to bottom, like a pen on the survey sheet.
   fill-mode is deliberately none: if the animation never runs, the drawing is simply there. */
@media (prefers-reduced-motion:no-preference){
  .plan .drawn{animation:plot .9s cubic-bezier(.32,.72,.4,1)}
  @keyframes plot{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
}

/* ---- entrance / exit / skylight / pit annotations ----
   Same symbol set on the plan plate, in the legend and in the per-cave list.
   Everything is a token, so it reads in either theme. */
.es .halo{fill:var(--paper); stroke:var(--paper); stroke-width:3.4; stroke-linejoin:round; vector-effect:non-scaling-stroke}
.es .sym{fill:var(--paper); stroke:var(--ink); stroke-width:1.5; stroke-linejoin:round; vector-effect:non-scaling-stroke}
.es .sym.solid{fill:var(--ink)}
.es .dot{fill:var(--ink); stroke:none}
.es.med{opacity:.62}
.es.low .sym{stroke-dasharray:3 2.2}
.es .qm{fill:var(--ink-2); font-family:var(--f-mono); font-weight:600; text-anchor:middle; dominant-baseline:central}

.ents{border-top:1px solid var(--hair); padding:11px 0}
.ents>.k{font-family:var(--f-mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); margin-bottom:8px}
.ents ul{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:10px}
.ents li{display:flex; gap:9px; align-items:flex-start}
.ents .gl{flex:none; width:18px; height:18px; margin-top:2px}
.ents .gl svg{display:block; width:18px; height:18px; overflow:visible}
.ents .bd{min-width:0}
.ents .h{font-size:13px; font-weight:600; color:var(--ink); line-height:1.35}
.ents .h .cf{font-weight:400; color:var(--ink-3)}
.ents .m{display:block; font-family:var(--f-mono); font-size:10px; letter-spacing:.04em; color:var(--ink-3); margin:1px 0 3px}
.ents .nt{margin:0; font-size:12.5px; line-height:1.5; color:var(--ink-2)}

.field{border-top:1px solid var(--hair); padding:11px 0}
.field .k{font-family:var(--f-mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); margin-bottom:4px}
.field .v{font-size:13.5px; line-height:1.55; color:var(--ink-2)}
.coord{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.coord code{font-family:var(--f-mono); font-size:13.5px; color:var(--ink); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
.copy{
  display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:6px;
  border:1px solid var(--rule); background:var(--paper-2); font-size:12px; color:var(--ink-2);
}
.copy:hover{background:var(--land)}
.copy.ok{border-color:var(--accent); color:var(--accent)}
.copy svg{width:12px; height:12px}
.prec{margin-top:6px; font-size:12px; color:var(--ink-3); line-height:1.5}

.photo{margin:10px 0}
.photo img{display:block; width:100%; border-radius:6px; border:1px solid var(--rule)}
.photo figcaption{font-size:11px; color:var(--ink-3); margin-top:3px}

/* ---- recorded fauna ----
   One rule per taxon; the accent rail marks the cave-adapted and endemic ones,
   which are the whole reason these caves are classified the way they are. */
.fauna{margin:4px 0 0; padding:0; list-style:none; display:flex; flex-direction:column; gap:9px}
.fauna li{padding-left:9px; border-left:2px solid var(--rule)}
.fauna li.hi{border-left-color:var(--accent)}
.fauna .sp{display:block; font-size:13.5px; line-height:1.35; color:var(--ink)}
.fauna .sp i{font-style:italic; font-weight:600}
.fauna .sp .au{font-weight:400; font-style:normal; color:var(--ink-3); font-size:11.5px}
.fauna .m{display:block; font-family:var(--f-mono); font-size:10px; letter-spacing:.04em; color:var(--ink-3); margin-top:1px}
.fauna .tr{display:block; font-size:12px; line-height:1.45; color:var(--ink-3); margin-top:1px}
.fauna li.hi .tr{color:var(--accent)}
.fauna .cn{display:block; font-size:12px; line-height:1.45; color:var(--ink-2)}

.gobtn{
  display:inline-flex; align-items:center; gap:7px; margin-top:14px; padding:8px 14px;
  border:1px solid var(--ink); border-radius:var(--r); background:var(--ink); color:var(--paper);
  font-size:13px; font-weight:500;
}
.gobtn svg{width:13px; height:13px}
.placeholder{padding:28px 20px; color:var(--ink-3); font-size:13.5px; line-height:1.6; text-align:center}
.placeholder b{display:block; font-family:var(--f-display); font-size:17px; color:var(--ink-2); margin-bottom:7px; font-weight:600}

/* ============================== footer ============================== */
.ft{
  flex:none; display:flex; align-items:center; gap:8px; padding:6px 12px;
  background:var(--paper); border-top:1px solid var(--rule);
  font-size:11px; color:var(--ink-3); line-height:1.35; z-index:6;
}
.ft p{margin:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ft .more{flex:none; margin-left:auto; color:var(--accent); text-decoration:underline; text-underline-offset:2px; font-size:11px}

/* ============================== modal ============================== */
.modal{position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center; padding:16px}
.modal.open{display:flex}
.modal .scrim{position:absolute; inset:0; background:rgba(10,13,15,.5)}
.modal .box{
  position:relative; max-width:520px; width:100%; max-height:82dvh; overflow-y:auto;
  background:var(--paper); border:1px solid var(--rule); border-radius:12px;
  box-shadow:var(--shadow); padding:20px 20px 24px;
}
.modal h2{margin:0 0 4px; font-family:var(--f-display); font-size:20px; font-weight:600}
.modal .box>p{margin:0 0 11px; font-size:13.5px; line-height:1.6; color:var(--ink-2); max-width:62ch}
.modal .box>p:last-child{margin-bottom:0}
.modal b{color:var(--ink); font-weight:600}
.modal .close{position:absolute; right:10px; top:10px; width:30px; height:30px; border-radius:50%; display:grid; place-items:center; color:var(--ink-3); background:var(--land)}
.modal .close svg{width:13px; height:13px}
.modal .kicker{font-family:var(--f-mono); font-size:9.5px; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3); margin-bottom:9px}
</style>
</head>
<body>

<div class="app">
  <header class="hd">
    <div class="brand">
      <h1 data-t="brand.title">Grutas da Terceira</h1>
      <span class="sub" data-t="brand.sub">Azores &middot; 97 caves</span>
    </div>
    <div class="seg" role="group" data-t-aria="a11y.view" aria-label="View">
      <button id="vMap" type="button" aria-pressed="true" data-t="view.map">Map</button>
      <button id="vList" type="button" aria-pressed="false" data-t="view.list">List</button>
    </div>
    <div class="seg lang" role="group" data-t-aria="a11y.lang" aria-label="Language">
      <button id="lgEn" type="button" aria-pressed="false" lang="en" aria-label="English">EN</button>
      <button id="lgPt" type="button" aria-pressed="false" lang="pt-PT" aria-label="Portugu&ecirc;s">PT</button>
    </div>
  </header>

  <div class="ctl">
    <label class="search" id="searchWrap">
      <span class="vh" data-t="search.label">Search caves</span>
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input id="q" type="text" data-t-ph="search.ph" placeholder="Search name, area, notes&hellip;" autocomplete="off" spellcheck="false">
      <button class="clr" id="qclr" type="button" data-t-aria="search.clear" aria-label="Clear search">&times;</button>
    </label>
    <button class="fbtn" id="fbtn" type="button" aria-expanded="false" aria-controls="tray">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M2 4h12M4.5 8h7M6.5 12h3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span data-t="filters.btn">Filters</span> <span class="n" id="fcount">0</span>
    </button>

    <div class="tray" id="tray" role="region" data-t-aria="filters.title" aria-label="Filters">
      <h3 data-t="filters.class">Legal class &mdash; Resolu&ccedil;&atilde;o 163/2024</h3>
      <div class="chips" id="fClass"></div>
      <h3 data-t="filters.prec">Position confidence</h3>
      <div class="chips" id="fPrec"></div>
      <h3 data-t="filters.area">Area</h3>
      <div class="chips" id="fArea"></div>
      <div class="foot">
        <span class="cnt" id="trayCnt"></span>
        <button class="linkbtn" id="fclear" type="button" data-t="filters.reset">Reset filters</button>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="stage">
      <canvas id="map" data-t-aria="a11y.map" aria-label="Map of Terceira showing cave locations. Use the list view for a screen-reader accessible index."></canvas>
      <div class="mapui">
        <div class="legend" id="legend" data-open="0">
          <button type="button" id="legToggle" aria-expanded="false" aria-controls="legBody">
            <span data-t="legend.title">Legend</span>
            <svg class="car" viewBox="0 0 12 12" width="10" height="10" aria-hidden="true" style="margin-left:auto"><path d="M2 4.5L6 8.5l4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
          <div class="body" id="legBody"></div>
        </div>
        <div class="scalebar" id="scalebar"><span id="scaleLabel">1 km</span><div class="bar" id="scaleRule" style="width:60px"></div></div>
        <div class="osmattr" id="osmAttr" hidden>&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors</div>
        <div class="zoom">
          <button type="button" id="zIn" data-t-aria="zoom.in" aria-label="Zoom in"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M7 2v10M2 7h10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
          <button type="button" id="zOut" data-t-aria="zoom.out" aria-label="Zoom out"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 7h10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
          <button type="button" id="zFit" data-t-aria="zoom.fit" aria-label="Fit whole island"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 5V2h3M9 2h3v3M12 9v3H9M5 12H2V9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button type="button" id="zOsm" data-t-aria="zoom.osm" aria-label="OpenStreetMap background" aria-pressed="false">OSM</button>
        </div>
      </div>

      <div class="list" id="list" hidden>
        <div class="lhead">
          <span class="cnt" id="listCnt"></span>
          <label class="vh" for="sort" data-t="list.sortBy">Sort by</label>
          <select class="sortsel" id="sort">
            <option value="len-" data-t="sort.lenDesc">Longest first</option>
            <option value="len+" data-t="sort.lenAsc">Shortest first</option>
            <option value="dep-" data-t="sort.depDesc">Deepest first</option>
            <option value="cls" data-t="sort.cls">Legal class</option>
            <option value="name" data-t="sort.name">Name A&ndash;Z</option>
            <option value="area" data-t="sort.area">Area</option>
          </select>
        </div>
        <ul class="rows" id="rows"></ul>
        <div class="about">
          <h2 data-t="about.title">About this catalogue</h2>
          <p data-t-html="about.p1"></p>
          <p data-t-html="about.p2"></p>
          <p data-t-html="about.p3"></p>
          <p data-t-html="about.p4"></p>
        </div>
      </div>
    </div>

    <div class="rail" id="rail">
      <div class="sheet" id="sheet" role="dialog" data-t-aria="a11y.detail" aria-label="Cave detail" aria-modal="false">
        <div class="grab" id="grab" aria-hidden="true"><i></i></div>
        <button class="close" id="sheetClose" type="button" data-t-aria="detail.close" aria-label="Close detail"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
        <div class="sheetbody" id="sheetBody"></div>
      </div>
    </div>
  </div>

  <footer class="ft">
    <p data-t-html="footer.note"></p>
    <button class="more" id="aboutBtn" type="button" data-t="footer.btn">Access &amp; safety</button>
  </footer>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="scrim" id="scrim"></div>
  <div class="box">
    <button class="close" id="modalClose" type="button" data-t-aria="modal.close" aria-label="Close"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
    <div class="kicker" data-t="modal.kicker">Before you go</div>
    <h2 id="modalTitle" data-t-html="modal.title">Access &amp; safety</h2>
    <p data-t-html="modal.p1"></p>
    <p data-t-html="modal.p2"></p>
    <p data-t-html="modal.p3"></p>
    <p data-t-html="modal.p4"></p>
    <p style="color:var(--ink-3); font-size:12px; margin-top:16px" data-t-html="modal.p5"></p>
  </div>
</div>

    'about.p1': 'Ninety-seven documented caves of Terceira &mdash; lava tubes, pit caves (<i>algares</i>), sea caves and dive-through fissures. Seventy-eight of them are the full official inventory of Resolução do Conselho do Governo n.º 163/2024, including the island&rsquo;s two show caves, Algar do Carvão and Gruta do Natal. The other nineteen are cavities documented by Os Montanheiros or in the literature that the 2024 classification does not list; twelve of those have no published coordinates at all and appear only in the list.',
    'about.p2': '<b>Class A caves are legally protected</b> under Resolução do Conselho do Governo n.º 163/2024 and DLR 10/2019/A. Entry is regulated. Arrange access through <b>Os Montanheiros</b>, the Azorean speleological society in Angra do Heroísmo.',
    'about.p3': 'Coastal caves such as <b>Gruta das Agulhas</b> can only be entered at low tide with a calm sea, and reaching them means a cliff descent. Sea caves marked dive-only need a boat. Pit caves need rope. None of these are casual visits.',
    'about.p4': 'Areas are grouped from the coordinates: the Biscoitos lava field, Lagoa do Negro, Cabrito, Monte Brasil, the Agualva coast, the central highlands, the eastern lowlands from São Sebastião to Cabo da Praia, and the western massif around Serreta and Santa Bárbara; caves with no location at all are grouped apart. Positions come from SIGCAVA (official points and survey centroids) and GBIF (surveyed entrances). Eight caves are shown with a dashed search area instead of a point &mdash; their coordinates are converted from 1994 military grid references, or are anchors on an islet, a cone or a cluster of neighbouring caves, good to roughly 300&ndash;800&nbsp;m. Twelve more have never had a coordinate published and are on no map. Survey plans are the georeferenced SIGCAVA 2024 line work, simplified for the web.',

    'about.p1': 'Noventa e sete cavidades documentadas da Terceira &mdash; tubos lávicos, <i>algares</i>, furnas marinhas e fendas de travessia a mergulho. Setenta e oito delas são o inventário oficial completo da Resolução do Conselho do Governo n.º 163/2024, incluindo as duas grutas turísticas da ilha, o Algar do Carvão e a Gruta do Natal. As outras dezanove são cavidades documentadas pelos Montanheiros ou na bibliografia que a classificação de 2024 não lista; doze dessas não têm quaisquer coordenadas publicadas e aparecem apenas na lista.',
    'about.p2': '<b>As grutas de classe A estão legalmente protegidas</b> pela Resolução do Conselho do Governo n.º 163/2024 e pelo DLR 10/2019/A. A entrada é regulada. O acesso combina-se com <b>Os Montanheiros</b>, a sociedade de espeleologia dos Açores, sediada em Angra do Heroísmo.',
    'about.p3': 'As grutas costeiras, como a <b>Gruta das Agulhas</b>, só se entram na maré baixa e com o mar calmo, e chegar até elas obriga a descer a arriba. As furnas marinhas assinaladas como só de mergulho exigem barco. Os algares exigem corda. Nenhuma destas visitas é um passeio.',
    'about.p4': 'As zonas são agrupadas a partir das coordenadas: o campo lávico dos Biscoitos, a Lagoa do Negro, o Cabrito, o Monte Brasil, a costa da Agualva, a serra central, as terras baixas do leste, de São Sebastião ao Cabo da Praia, e o maciço ocidental, em torno da Serreta e de Santa Bárbara; as grutas sem localização são agrupadas à parte. As posições vêm do SIGCAVA (pontos oficiais e centróides de levantamento) e do GBIF (entradas topografadas). Oito grutas aparecem com uma área de busca a tracejado em vez de um ponto &mdash; as suas coordenadas foram convertidas da grelha militar de 1994, ou são âncoras sobre um ilhéu, um cone ou um conjunto de grutas vizinhas, com um erro da ordem dos 300&ndash;800&nbsp;m. Outras doze nunca tiveram coordenadas publicadas e não constam de mapa nenhum. As plantas topográficas são o traçado georreferenciado do SIGCAVA 2024, simplificado para a web.',

const NOTES_PT = {
  0: 'Gruta turística d\'Os Montanheiros, aberta ao público desde o túnel de visita de 1966; Monumento Natural Regional (Reserva Geológica em 1987, MN desde 2004); a cratera desce ~45 m em conduta vertical até uma rampa de escombros, seguindo-se novo desnível que termina numa lagoa límpida, ~90 m no total; estalactites e estalagmites de sílica amorfa branca, extremamente raras; duas espécies de aranhas são conhecidas apenas daqui; primeira descida em 1893; ~60 000 visitantes em 2019; novo centro de visitantes CAVE em construção desde 10-2024. Altitude da entrada: ~583 m habitualmente publicados, 629 m na tabela de 1994, 603 m pelo GLO-30 neste ponto',
  1: 'Tubo lávico costeiro na Ponta dos Coelhos, na base do Pico do Refugo; entrar apenas na maré baixa e com o mar calmo; exige descida da arriba; chamou-se inicialmente Galeria da Salga e o artigo de 1994 usa G. da Salga. Em 2023 o mar partiu a plataforma lávica da única entrada e as visitas são agora «muito problemáticas» com mar agitado; a tentativa de abrir a entrada de montante, em 04-01-2024, foi abandonada por causa de lajes instáveis; o terreno é privado',
  2: 'A gruta mais comprida da Terceira (2713 m topografados; 4421 m segundo o GBIF; possivelmente mais de 4,6 km); pastagens do Terreiro da Macela; o percurso pedestre PR09TER passa nas proximidades; também designada Gruta do Bastião (1994); campo pahoehoe do Pico Galiarte; a entrada principal de Nunes 2014 fica em 38.76320 -27.25355, a 186 m deste ponto',
  3: 'Formações de opala e sílica; três entradas (uma clarabóia e dois abatimentos); nos dias de grandes chuvadas fica completamente inundada entre os pontos 8 e 11 do levantamento; campo pahoehoe do Pico Galiarte (<6600 anos BP, Nunes 2014) — a antiga atribuição ao «Pau Velho, 1761» está ultrapassada, pois a escoada de 1761 não contém grutas; a entrada principal de Nunes 2014 fica em 38.77939 -27.25168, a 125 m deste ponto; também designada G. do Rabão',
  4: 'Campo pahoehoe do Pico Galiarte (<6600 anos BP, Nunes 2014); a antiga atribuição à escoada do Pau Velho de 1761 está ultrapassada; tubo de acesso pedonal por debaixo de pastagens, que termina num abatimento intransponível; a referência da grelha militar de 1994 fica 590 m ao lado — preferir esta posição (as coordenadas do BDJ 2019 concordam)',
  5: 'A entrada é um buraco de 40x40 cm; segundo Os Montanheiros, o melhor conjunto de formações de tubo lávico da ilha; descoberta em 1987; comprimento de 108,7 m segundo o SIGCAVA (um registo anterior dava 109,7 m); campo pahoehoe do Pico Galiarte (<6600 anos BP, Nunes 2014); a entrada principal de Nunes 2014 fica em 38.78067 -27.25210, a 68 m deste ponto',
  6: 'Junto às ruínas da Ermida da Madre de Deus (c. 1690); duas entradas; algar interior de 13,50 m no extremo NW (ponto 24 do levantamento de 1994); estrangulamento que obriga a rastejar entre os pontos 12 e 15; a laje da «Língua de Sogra»; erupção da Fonte do Bastardo, 2000-3000 anos BP',
  7: 'Integra o sistema Malha-Balcões-Chamusca; Rede Natura 2000; a entrada principal de Nunes 2014 fica em 38.74966 -27.25374, a 180 m deste ponto; a parte de montante foi revisitada em 01-02-2024',
  8: 'Gruta turística d\'Os Montanheiros, aberta desde 01-06-1999 — o primeiro tubo lávico aberto ao público nos Açores; trânsito fácil, chão com poucos desníveis e tectos altos; primeira Missa de Natal no interior a 25-12-1969, tradição desde então; a missão de astronautas análogos CAMões viveu lá dentro de 22 a 28 de novembro de 2023; inicialmente Galeria Negra, renomeada Gruta do Cavalo em 1964 depois de nela se terem encontrado ossos de cavalo, e Gruta do Natal desde 1969; a entrada principal de Nunes 2014 fica em 38.73747 -27.26846, a 52 m deste ponto; o IPEA situa-a nos Altares (Angra)',
  9: 'Zona do Cabrito; a galeria de fotografias dos Montanheiros junta-a à Gruta do Camelo sob o título «Gruta de Santa Maria e do Carmelo», mas todos os catálogos as mantêm separadas',
  10: 'Segunda mais comprida; o tubo desenvolve-se de norte para sul; termina junto a 38.75003 e 38.75253, na longitude -27.267; também designada Cafua Velha; escoadas do Pico Gordo, ~4480 anos BP (Nunes 2014); a antiga atribuição à escoada do Pau Velho de 1761 está ultrapassada; a entrada principal de Nunes 2014 fica em 38.75012 -27.26602, a 181 m deste centróide de levantamento; o IPEA situa-a nos Altares (Angra)',
  11: 'Perto da Lagoa do Negro; a entrada principal assemelha-se a uma toca de coelho, tem três entradas possíveis e é labiríntica, com grandes zonas de abatimento; sistema fissural do Pico do Gaspar (<12 100 anos BP); a entrada principal de Nunes 2014 fica em 38.73857 -27.27026, a 150 m deste ponto; o IPEA situa-a nos Altares (Angra)',
  12: 'Perto da Gruta dos Balcões; também designada Gruta do Pau Velho e Gruta dos Carvoeiros; campo pahoehoe do Pico Galiarte',
  13: 'A saída dos Montanheiros de 11-01-2024 não conseguiu encontrar a entrada',
  15: 'Rede Natura 2000',
  16: 'Zona da Rocha do Chambre',
  18: 'Georreferenciado e topografado em 18-01-2024',
  20: 'Perto da Lagoa do Negro; o IPEA situa-o nos Altares (Angra); georreferenciado e topografado em 01-02-2024',
  23: 'Gémeo da Gruta do Pico do Funil; altitude ~580 m. Em 25-01-2024 os Montanheiros registaram que terá sido completamente subterrado pelo proprietário em 2021 ou 2022, juntamente com a gruta adjacente — considerar destruído ou inacessível',
  26: 'O IPEA indica 300 m de profundidade e a freguesia do Raminho; o SIGCAVA indica a Serreta e não regista a profundidade — divergência por resolver. Encontrado obstruído em 1992 e desobstruído em 22 e 29-01-1995; poderá ser o algar descrito por F. Fouqué em 1873, embora um «Algar do Fouqué» distinto tenha sido visitado em 2024 — relação por esclarecer',
  27: 'Entrada por um poço de 12 m para 151 m de tubo; perto da Lagoa do Negro; altitude ~545 m; descoberto em 24-12-1990 e medido em 01-01-1991; o IPEA situa-o nos Altares (Angra); georreferenciado e topografado em 01-02-2024',
  28: 'Comprimento de 114 m segundo o IPEA; o artigo de 1994 indica 60 m. A profundidade é de 20 m segundo Borges 1994 (o valor aqui mostrado) contra 14 m no registo do SIGCAVA — nada nas fontes o resolve. Poço de entrada e depois galeria, com material de progressão vertical; topografia e georreferenciação refeitas em 11-01-2024',
  29: 'Serreta, perto do Pico Negrão; existe uma segunda Cova do Caldeirão (Angra/Sé), catalogada à parte e de localização desconhecida',
  30: 'Fenda tectónica no Monte Brasil; cerca de 100 m de profundidade segundo o IPEA; terreno vertical exigente. Os Montanheiros visitaram uma «Fenda do Monte Brasil» em 22-02-2024 e o registo não dá mais pormenores; provavelmente é a mesma cavidade, mas nenhuma fonte o confirma, pelo que os dois registos se mantêm separados',
  31: 'Gruta de captação de água no bordo oeste da caldeira de Guilherme Moniz, alimentada por fortes nascentes na escoada do Pico do Carvão (~2000 anos BP); acesso controlado, com visitas guiadas ocasionais (Pedaços de Mar em 03-06-2023; expedição fotográfica dos Montanheiros em 13-06-2025); a Wikipédia marca a entrada em 38.70877 -27.17247',
  32: 'Costa das Quatro Ribeiras; distinta da Furna das Pombas e da Furna dos Ninhos apesar das coordenadas do SIGCAVA quase coincidentes, que são âncoras de troço de arriba',
  33: 'O Mapcarta identifica erradamente este ponto como Furna das Pombas',
  34: 'Outeiro do Bogango; altitude ~600 m; também designada Algar das Feiticeiras; georreferenciada, explorada e topografada em 11-01-2024',
  35: 'Furna marinha no percurso pedestre PR02TER — Baías da Agualva; é uma de três furnas de erosão marinha distintas neste troço da costa das Quatro Ribeiras (com a Furna dos Ninhos e a Furna da Nascente) que partilham quase uma só coordenada no SIGCAVA — os pontos são âncoras de troço de arriba, não entradas individuais',
  36: 'Zona do Cabrito; gruta com nascentes na mesma escoada do Pico do Carvão que a Furna d\'Água; visitada em actividades guiadas em 2023 e na expedição fotográfica de 13-06-2025',
  38: 'Costa das Quatro Ribeiras; distinta da Furna das Pombas e da Furna da Nascente apesar das coordenadas do SIGCAVA quase coincidentes, que são âncoras de troço de arriba',
  39: 'Coordenadas registadas e interior fotografado em 04-01-2024',
  41: 'Também designada Algar do Felisberto Joaquim — um algar nos pastos de Felisberto Joaquim, em São Sebastião (1991); georreferenciada e topografada em 18-01-2024',
  43: 'Furna marinha na face norte do Ilhéu Pequeno (ilhéu ocidental), Ilhéus das Cabras; só por barco, a ~10 min da marina de Angra; abertura de cerca de 4 m de altura na maré baixa. «Gruta dos Ratões» é outro nome desta mesma gruta, não uma gruta distinta — quatro fontes independentes concordam (CM Angra/Angrosfera «Gruta Briza Azul ou Gruta dos Ratões»; PdL 2018 pp. 49-52; Borges 1994 lista uma única gruta marinha nos Ilhéus das Cabras, com 80 m; dive.visitazores «face norte do ilhéu ocidental»). Uma coordenada por vezes associada ao nome Ratões, 38.63030 -27.14340, fica no lado sul do ilhéu oriental — ilhéu errado e face errada. Baptizada em 28-08-1971 com o nome da embarcação «Briza Azul». Comprimento oficial de 80 m (SIGCAVA/IPEA/1994), mas Barcelos remediu-a em 2018 com ~50 m de comprimento por 10 m de largura e 7-8 m de altura; a fenda de entrada vai da superfície aos ~15 m e os mergulhadores chegam aos 24 m. O SIGCAVA indica a freguesia da Feteira, o PdL 2018 e a Wikipédia indicam o Porto Judeu (os ilhéus só pertenceram à Feteira entre 1911 e 1913) — usa-se aqui o valor do SIGCAVA',
  44: 'Entrada do GBIF em 38.72977 -27.15186; escoada lávica das Fontinhas/Agualva («Biscoito das Fontinhas», 1994); georreferenciada e topografada em 18-01-2024',
  45: 'Aberta por uma retroescavadora em 2016, ao abrir o alicerce de um poste de iluminação; ~30 m de tubo selado, com raízes através das fissuras do tecto mas sem tapetes microbianos, o que os descobridores atribuem ao isolamento da gruta; o PdL 2016 dá a freguesia do Porto Martins, o SIGCAVA indica a Praia da Vitória',
  47: 'Campo pahoehoe do Pico Galiarte (<6600 anos BP, Nunes 2014); a antiga atribuição à escoada do Pau Velho de 1761 está ultrapassada; segunda entrada encontrada em 14-08-2014 — 15 m de rastejamento lamacento, intransitável com as inundações de inverno; georreferenciada e topografada de novo em 01-02-2024',
  48: 'Integra o sistema Malha-Balcões-Chamusca',
  49: 'Distinta da Gruta da Malha; dois pequenos buracos servem de entrada, altura máxima de 2 m, com lama; colunas de limonite, outros depósitos secundários, raízes e estalactites lávicas (PdL 2014)',
  50: 'Costeira; entrada distinta no SIGCAVA (o artigo de 1994 também usa Salga como nome alternativo das Agulhas); ~25 m, altura máxima de 70 cm, sem formações relevantes; há muito conhecida dos Montanheiros mas só explorada em 09-07-2014',
  52: 'A «Gruta da Terra Mole II», catalogada à parte, é a Gruta do Martelo (PdL 2014); campo pahoehoe do Pico Galiarte; filmada pela televisão alemã (Galileo X-Plorer) em 28-05-2025',
  53: 'Canada das Mercês',
  54: 'Duas entradas (levantamento de 1994)',
  55: 'Localizada em 25-10-1992 e explorada em 01-11-1992; georreferenciada e topografada em 18-01-2024',
  56: 'Entrada do GBIF em 38.68478 -27.07359; também designada G. do Recanto; erupção da Fonte do Bastardo, 2000-3000 anos BP; o artigo de 1994 dá a freguesia do Porto Martins, o IPEA e o SIGCAVA indicam a Fonte do Bastardo; georreferenciada e topografada em 18-01-2024',
  58: 'Duas entradas, a mais larga com um muro de pedra no interior contra os animais, a segunda bem mais pequena e difícil; ~100 m em duas secções separadas por um desabamento, altura máxima de 1,50 m, com chão e tecto originais; escoada do Pico da Fonte do Bastardo; o PdL 2014 nota que pertence à Vila de São Sebastião, apesar de muitos a situarem no Porto Martins',
  59: 'Tubo de pouca altura com várias aberturas, junto ao Clube de Golfe da Ilha Terceira, baptizado na descoberta (PdL 2016); escoada lávica das Fontinhas/Agualva',
  60: 'Zona do Cabrito; a referência da grelha de 1994 converte-se para menos de 7 m deste ponto; variante de grafia Gruta do Carmelo, e a galeria de fotografias dos Montanheiros junta-a à Furna de Santa Maria sob o título «Gruta de Santa Maria e do Carmelo» — o SIGCAVA, o IPEA e o artigo de 1994 mantêm-nas como duas grutas a ~65 m uma da outra',
  61: 'O IPEA situa as grutas do Cerro nos Altares (Angra)',
  62: 'O IPEA situa as grutas do Cerro nos Altares (Angra)',
  63: 'O IPEA situa as grutas do Cerro nos Altares (Angra)',
  64: 'O IPEA indica a freguesia do Posto Santo; o SIGCAVA indica Porto Judeu (zona do Cabrito)',
  65: 'Escoada lávica das Fontinhas/Agualva; georreferenciada e topografada em 25-01-2024',
  66: 'Também designada Gruta da Terra Mole II — encontrada em 10-07-2014, «Martelo» porque se encontrou um martelo próximo da entrada (PdL 2014); duas entradas, altura máxima de 80 cm, a água da chuva entra e o chão está cheio de lama e detritos; mesma escoada das grutas da zona do Pau Velho (campo do Pico Galiarte)',
  67: 'Tubo com mais de 120 m, com linhas de fluxo bem definidas, balcões laterais de considerável dimensão e lava rendilhada; troços muito estreitos e lamacentos limitam a progressão (PdL 2014)',
  68: 'Gémea do Algar do Pico do Funil. Em 25-01-2024 os Montanheiros registaram que terá sido completamente subterrada pelo proprietário em 2021 ou 2022, juntamente com o algar adjacente — considerar destruída ou inacessível',
  69: 'Posição contestada: o SIGCAVA coloca-a aqui, nos Biscoitos, ao lado da Gruta dos Balcões, mas o registo da sua descoberta (PdL 2016, Notas Espeleológicas, p. 81) situa-a «a umas centenas de metros» da Gruta do Biscoito, junto ao Clube de Golfe da Ilha Terceira, na Agualva (~38.735 -27.15), a cerca de 9 km daqui. Ou o SIGCAVA a colocou mal, ou existem dois sítios homónimos. Mostra-se o ponto do SIGCAVA enquanto nenhuma fonte resolver a questão. Interior baixo, várias aberturas',
  70: 'Serretinha; comprimento de 60 m segundo o IPEA / 31,6 m segundo o levantamento de 1994',
  72: 'Estalactites, estalagmites e colunas de limonite; encontrada em 06-12-1992 como um conjunto de «buracos» perto do Pau Velho; foi aqui que se colheu a amostra Ar/Ar do campo do Pico Galiarte',
  73: 'O IPEA indica o Posto Santo; o SIGCAVA indica o Porto Judeu. A busca de 25-01-2024 não conseguiu encontrar a entrada sob vegetação densa',
  74: 'Zona da Lagoa do Negro; o IPEA situa-a nos Altares (Angra); georreferenciada e topografada em 01-02-2024',
  75: 'Tubo lávico submarino ao largo do Monte Brasil — o campo de geomorfologia do IPEA diz «gruta submarina» e o ponto do SIGCAVA cai no mar (GLO-30 = 0 m), o que é coerente; topografado em 1994 pelos mergulhadores P. Brunet e C. Thomas com A. Silva',
  76: 'Tubo lávico submarino ao largo do Monte Brasil — o campo de geomorfologia do IPEA diz «gruta submarina» e o ponto do SIGCAVA cai no mar (GLO-30 = 0 m), o que é coerente; topografado em 1994 pelos mergulhadores P. Brunet e C. Thomas com A. Silva',
  77: 'Oficialmente classe D = localização desconhecida; esta é uma conversão da referência da grelha militar de 1994 — apenas aproximada, e cai no mar, pelo que não se regista altitude; o IPEA descreve um tubo em arriba, nas Cinco Ribeiras',
  78: 'Pico Matias Simão, cone de salpicos numa fractura radial de Santa Bárbara, nos Altares, junto ao mar, com 153 m; não consta do SIGCAVA. A posição mostrada está ancorada sobre o próprio cone: a referência da grelha de 1994 converte-se para 38.80179 -27.29105, que cai no mar (GLO-30 = 0 m) — impossível para um algar em terra. O artigo de 1994 dá 150 m de altitude à entrada. Também designado Algar do Pico Matias Simão; a saída dos Montanheiros de 11-01-2024 procurou a entrada e não a encontrou',
  79: 'Consta apenas da «Lista de grutas dos Açores» da Wikipédia — sem artigo, sem coordenadas, sem medidas e sem qualquer outra confirmação',
  80: 'Visitado pelos Montanheiros em 22-02-2024, na ronda de georreferenciação, listado entre a Cafua do Portão e a Fenda do Monte Brasil; o nome homenageia F. Fouqué, cujo Voyages Géologiques aux Açores (1873) descreve um grande algar — em 1992 os Montanheiros julgavam que esse algar era o obstruído Algar dos Funis, pelo que a relação entre os dois está por esclarecer',
  81: 'A segunda Cova do Caldeirão, distinta da da Serreta já catalogada; a Wikipédia descreve uma fenda em encosta com 100 m de profundidade, mas esses números são idênticos aos da Fenda do Pico Zimbreiro, pelo que é possível um erro de cópia na wiki e aqui não se regista profundidade',
  82: 'Fenda no Pico do Má-Olho, Terra Brava, verificada em 18-08-2015: apenas 5 m de profundidade mas é preciso corda; muita obsidiana incrustada na rocha; nota informal, nunca catalogada, e a fonte não indica a freguesia',
  83: 'Medida em 07-03-2004, no mesmo dia que a Gruta da Terra Mole',
  84: 'Zona da Bugia; não consta do SIGCAVA',
  85: 'Na encosta da Serra do Morião, do lado de Porto Judeu / São Sebastião; procurada em 27-01-1991 e encontrada tapada («a furna encontrava-se tapada»); consta também da lista da Wikipédia',
  86: 'Também designada Cafua do Portão; há um conjunto de quatro fotografias publicado em montanheiros.com/espeleologia-terceira/; visitada na ronda de georreferenciação de 22-02-2024; sem coordenadas publicadas',
  87: 'Vários tubos lávicos de cerca de 100 m cada, junto ao Pico Geraldes, ao Pico do Magina e ao Pico da Vima — um conjunto de cavidades, não uma só, razão pela qual não se regista comprimento',
  88: 'Gruta costeira na Baía de Vila Maria, a sul da Praia da Vitória; consta apenas da lista da Wikipédia — sem artigo e sem dados',
  89: 'Nome novo registado pelos Montanheiros; georreferenciada, explorada e topografada em 18-01-2024, na mesma ronda do Baldio, Santo António, Santa Catarina, João Caldo Quente, Felisberto Joaquim e Achada, o que a situa na zona de São Sebastião / Fonte do Bastardo, no SE da ilha; as coordenadas tomadas nesse dia não estão publicadas',
  90: 'Complexo de galerias subaquáticas na zona do Porto das Cinco Ribeiras; o mergulho começa na piscina natural e o acesso é feito directamente pela costa (Wikipédia: «o acesso é feito directamente pela costa»), não sendo necessário barco; galerias até cerca de 16 m; correntes fracas, usada para mergulhos de iniciação e nocturnos',
  91: 'Ribeira dos Pães; não consta do SIGCAVA',
  92: 'Visitada em 22-02-2024 juntamente com as grutas do Cerro I, II e III e uma «Gruta do Cerro (?)» por identificar, pelo que poderá existir também uma Cerro IV; a posição é uma âncora sobre o conjunto do Cerro, não uma medição; o IPEA situa as grutas do Cerro nos Altares (Angra)',
  93: 'Nome novo registado em 01-02-2024, na mesma ronda da Cascata, Terra Mole, Pequena, Negro e Mistério; o Pico das Caldeirinhas é um cone de escórias antigo da Zona Fissural Basáltica cartografado por Nunes 2014 (fig. 3) nas terras altas de Biscoitos/Altares, o que é a única pista de localização publicada',
  94: 'Descoberta pelos Montanheiros no início de 2012 e anunciada em 24-05-2012 como a 66.ª cavidade da ilha; 305,85 m por vários túneis ramificados, três aberturas, estalactites lávicas, depósitos de sílica, bolores amarelos no tecto, lévees e chão pahoehoe; entram lama e humidade pelas aberturas; existe uma Gruta do Tanque distinta na Graciosa; sem coordenadas publicadas',
  95: 'Gruta de erosão marinha ao longo das fracturas verticais dos tufos dos Ilhéus das Cabras, nomeada pelo Prof. F. Cota Rodrigues a par da Gruta Brisa Azul; a fonte não diz em qual dos dois ilhéus, pelo que a posição é uma âncora sobre o par de ilhéus; algumas das cavidades dos ilhéus são subaquáticas. Como na Brisa Azul, usa-se a freguesia da Feteira, à maneira do SIGCAVA, ao passo que o PdL 2018 e a Wikipédia defendem o Porto Judeu',
  96: 'Sem nome na fonte — esta designação é descritiva, não um topónimo documentado. Uma fenda no lado norte do Ilhéu Grande permite atravessar o ilhéu a nado por 240 m e sair dentro de outra gruta do lado do canal, «não sem alguma dificuldade e risco»; a gruta do canal admite pequenas embarcações; à sua boca surge episodicamente água amarelada, de tufo em suspensão. A posição é a âncora do Ilhéu Grande, confirmado como o ilhéu oriental pela altura GLO-30 de 138 m contra os 147 m publicados'
};

/* ------------------------------------------------------------------ geo */
const KX = Math.cos(38.72 * Math.PI / 180);   // longitude compression
const MPU = 1.1132;                            // metres per world unit
const EY = { max: 0 };

function toWorld(ex, ey) { return [ex * KX, EY.max - ey]; }
function lonlatToWorld(lon, lat) {
  return toWorld((lon + 27.42) * 1e5, (lat - 38.6) * 1e5);
}

/* precompute world bounds from the coastline */
(function () {
  let ymax = -Infinity;
  for (const f of DATA.coast) for (let i = 1; i < f.length; i += 2) if (f[i] > ymax) ymax = f[i];
  EY.max = ymax;
})();

const BOUNDS = (function () {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const eat = (wx, wy) => { if (wx < x0) x0 = wx; if (wx > x1) x1 = wx; if (wy < y0) y0 = wy; if (wy > y1) y1 = wy; };
  for (const f of DATA.coast) for (let i = 0; i < f.length; i += 2) { const p = toWorld(f[i], f[i + 1]); eat(p[0], p[1]); }
  for (const c of DATA.caves) {
    if (c.la == null || c.lo == null) continue;
    const p = lonlatToWorld(c.lo, c.la); eat(p[0], p[1]);
  }
  return { x0, y0, x1, y1, w: x1 - x0, h: y1 - y0 };
})();

/* pre-project every static path once */
function project(flat) {
  const o = new Float64Array(flat.length);
  for (let i = 0; i < flat.length; i += 2) { o[i] = flat[i] * KX; o[i + 1] = EY.max - flat[i + 1]; }
  return o;
}
function bboxOf(a) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (let i = 0; i < a.length; i += 2) {
    if (a[i] < x0) x0 = a[i]; if (a[i] > x1) x1 = a[i];
    if (a[i + 1] < y0) y0 = a[i + 1]; if (a[i + 1] > y1) y1 = a[i + 1];
  }
  return [x0, y0, x1, y1];
}
const COAST = DATA.coast.map(f => { const a = project(f); return { a, b: bboxOf(a) }; });
const ROADS = {
  a: DATA.roads.a.map(f => { const a = project(f); return { a, b: bboxOf(a) }; }),
  b: DATA.roads.b.map(f => { const a = project(f); return { a, b: bboxOf(a) }; })
};
const PLACES = DATA.places.map(p => ({ n: p.n, r: p.r, w: toWorld(p.p[0], p.p[1]) }));

/* survey plans: decimetre-local -> world units */
const PLANS = DATA.plans.map(pl => {
  const o = lonlatToWorld(pl.o[0], pl.o[1]);           // world coords of local origin (bbox min)
  const ux = 1 / (MPU * 10);                           // decimetres -> world x units
  const uy = 1 / (1.10574 * 10);
  const parts = pl.p.map(f => {
    const a = new Float64Array(f.length);
    for (let i = 0; i < f.length; i += 2) { a[i] = o[0] + f[i] * ux; a[i + 1] = o[1] - f[i + 1] * uy; }
    return a;
  });
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const a of parts) { const b = bboxOf(a); if (b[0] < x0) x0 = b[0]; if (b[1] < y0) y0 = b[1]; if (b[2] > x1) x1 = b[2]; if (b[3] > y1) y1 = b[3]; }
  return { n: pl.n, c: pl.c, parts, b: [x0, y0, x1, y1], w: pl.w, h: pl.h, raw: pl.p };
});
const PLAN_BY_NAME = new Map(PLANS.map((p, i) => [p.n, i]));

/* show caves get synthetic records so they are tappable */
const SHOW = DATA.show.map((s, i) => ({
  i: -1 - i, n: s.n, show: true, w: toWorld(s.p[0], s.p[1]),
  pl: PLAN_BY_NAME.has(s.n) ? PLAN_BY_NAME.get(s.n) : undefined

/* Entrance annotations, resolved once per plan into world coordinates (map

   symbols stay pinned to the drawing even where its georeferencing and the

const ENT_BY_PLAN = DATA.plans.map(pl => {
  const o = lonlatToWorld(pl.o[0], pl.o[1]);
  return (ENTRANCES[pl.n] || []).map(p => {
    const w = lonlatToWorld(p.lo, p.la);
    return { p, wx: w[0], wy: w[1], mx: (w[0] - o[0]) * MPU, my: (o[1] - w[1]) * 1.10574 };

});
/* which record a tapped annotation belongs to */
const ITEM_BY_PLAN = new Map();
for (const c of DATA.caves) if (c.pl !== undefined) ITEM_BY_PLAN.set(c.pl, c);

/* ------------------------------------------------------------------ model */
const HALO = {
  'converted 1994 grid (±300-800 m)': 550, 'approximate': 400,
  'area anchor (islet)': 300, 'area anchor (islet group)': 600,
  'area anchor (cave group)': 400, 'area anchor (cone)': 400
};

/* A cave with no published coordinate at all keeps its row, its card and its
   place in the list, but has no world position: it is skipped by every map
   loop and drawn nowhere. `located` is the single flag the rest of the file
   tests. */
for (const c of DATA.caves) {
  c.located = c.la != null && c.lo != null;
  if (c.located) {
    const w = lonlatToWorld(c.lo, c.la);
    c.wx = w[0]; c.wy = w[1];
  }
  c.halo = c.located ? (HALO[c.ct] || 0) : 0;
  /* One index, both languages: names/freguesia/concelho stay Portuguese, and
     the English AND Portuguese notes and area names are folded in, so a query
     matches whichever language the reader happens to type. Aliases go in too,
     so "Ratões" finds Gruta Brisa Azul and "Terra Mole II" finds Martelo. */
  c.norm = norm([c.n, (c.al || []).join(' '), c.f, c.co, c.nt || '', NOTES_PT[c.i] || '',

/* ------------------------------------------------------------------ camera */
const cam = { x: 0, y: 0, k: 1 };
let VW = 0, VH = 0, DPR = 1, fitK = 1, userMoved = false;

function resize() {
  const r = canvas.getBoundingClientRect();
  if (r.width < 2 || r.height < 2) return;
  VW = Math.round(r.width); VH = Math.round(r.height);
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  canvas.width = Math.round(VW * DPR); canvas.height = Math.round(VH * DPR);
  const pad = VW < 560 ? 14 : 26;
  fitK = Math.min((VW - pad * 2) / BOUNDS.w, (VH - pad * 2) / BOUNDS.h);
  if (!userMoved) fit(false); else { clampCam(); requestDraw(); }
}
function fit(animate) {
  const target = { x: (BOUNDS.x0 + BOUNDS.x1) / 2, y: (BOUNDS.y0 + BOUNDS.y1) / 2, k: fitK };
  if (animate) { flyTo(target); return; }

}
function clampCam() {
  const kMin = fitK * 0.85, kMax = fitK * 700;

  const mx = Math.max(BOUNDS.w * 0.5, VW / cam.k * 0.42);
  const my = Math.max(BOUNDS.h * 0.5, VH / cam.k * 0.42);
  const cx = (BOUNDS.x0 + BOUNDS.x1) / 2, cy = (BOUNDS.y0 + BOUNDS.y1) / 2;

  cam.y = Math.min(cy + my, Math.max(cy - my, cam.y));

const SX = wx => (wx - cam.x) * cam.k + VW / 2;
const SY = wy => (wy - cam.y) * cam.k + VH / 2;

function zoomAt(px, py, factor) {
  userMoved = true;
  const wx = (px - VW / 2) / cam.k + cam.x, wy = (py - VH / 2) / cam.k + cam.y;
  const prev = cam.k;
  cam.k = Math.min(fitK * 700, Math.max(fitK * 0.85, cam.k * factor));
  if (cam.k === prev) return;
  cam.x = wx - (px - VW / 2) / cam.k;
  cam.y = wy - (py - VH / 2) / cam.k;
  clampCam(); requestDraw();
}

let flyRAF = 0;

  if (reduce) { Object.assign(cam, t); clampCam(); requestDraw(); return; }
  const s = { x: cam.x, y: cam.y, k: cam.k }, dur = ms || 620, t0 = performance.now();
  const step = now => {
    const u = Math.min(1, (now - t0) / dur), e = u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
    cam.x = s.x + (t.x - s.x) * e; cam.y = s.y + (t.y - s.y) * e;

/* ------------------------------------------------------------------ tiles
   Optional OpenStreetMap raster underlay. Off by default, remembered locally.
   The map projection stays equirectangular: each tile is stretched linearly
   onto its own lat/lon box, which at these zooms misregisters by far less
   than a line width. Everything here is fail-soft — a tile that never loads
   just leaves the vector map showing through, so the app is unchanged offline. */
const OSM_KEY = 'grutas-terceira.osm';
let OSM = false;
try { OSM = localStorage.getItem(OSM_KEY) === '1'; } catch (_) { }

const TILES = new Map();                 /* "z/x/y" -> Image (._bad once failed) */

function tileLat(y, z) {
  return Math.atan(Math.sinh(Math.PI * (1 - 2 * y / Math.pow(2, z)))) * 180 / Math.PI;
}
function tileY(lat, n) {
  const r = lat * Math.PI / 180;
  return Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n);
}

function drawTiles() {
  if (!OSM) return;
  const mpp = MPU / cam.k;
  const z = Math.max(8, Math.min(19, Math.round(Math.log2(156543.034 * KX / mpp))));
  const n = Math.pow(2, z);

  /* viewport -> lon/lat, the same inversion the graticule uses */
  const lonMin = -27.42 + (vx0 / KX) / 1e5, lonMax = -27.42 + (vx1 / KX) / 1e5;
  const latMax = 38.6 + (EY.max - vy0) / 1e5, latMin = 38.6 + (EY.max - vy1) / 1e5;

  const cl = (v) => Math.max(0, Math.min(n - 1, v));
  const x0 = cl(Math.floor((lonMin + 180) / 360 * n)), x1 = cl(Math.floor((lonMax + 180) / 360 * n));
  const y0 = cl(tileY(latMax, n)), y1 = cl(tileY(latMin, n));
  if ((x1 - x0 + 1) * (y1 - y0 + 1) > 40) return;   /* over-fetch guard */

  for (let tx = x0; tx <= x1; tx++) {
    for (let ty = y0; ty <= y1; ty++) {
      const key = z + '/' + tx + '/' + ty;
      let img = TILES.get(key);
      if (!img) {
        img = new Image();
        img.onload = requestDraw;
        img.onerror = () => { img._bad = true; };
        img.src = 'https://tile.openstreetmap.de/' + z + '/' + tx + '/' + ty + '.png';
        if (TILES.size > 300) TILES.delete(TILES.keys().next().value);
        TILES.set(key, img);
      }
      if (img._bad || !img.complete || !img.naturalWidth) continue;
      const a = lonlatToWorld(tx / n * 360 - 180, tileLat(ty, z));
      const b = lonlatToWorld((tx + 1) / n * 360 - 180, tileLat(ty + 1, z));
      ctx.drawImage(img, SX(a[0]), SY(a[1]), (b[0] - a[0]) * cam.k, (b[1] - a[1]) * cam.k);
    }
  }
}

/* ------------------------------------------------------------------ draw */
let pending = false;
function requestDraw() { if (!pending) { pending = true; requestAnimationFrame(drawNow); } }

let hits = [];

function strokePath(a, bb) {
  if (bb[2] < vx0 || bb[0] > vx1 || bb[3] < vy0 || bb[1] > vy1) return;
  ctx.moveTo(SX(a[0]), SY(a[1]));
  for (let i = 2; i < a.length; i += 2) ctx.lineTo(SX(a[i]), SY(a[i + 1]));
}
let vx0 = 0, vy0 = 0, vx1 = 0, vy1 = 0;

function drawNow() {
  pending = false;
  if (!VW) return;
  const k = cam.k;
  vx0 = cam.x - VW / (2 * k); vx1 = cam.x + VW / (2 * k);
  vy0 = cam.y - VH / (2 * k); vy1 = cam.y + VH / (2 * k);
  const mpp = MPU / k;                                   // metres per CSS pixel

  hits = [];
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, VW, VH);
  ctx.fillStyle = C.sea; ctx.fillRect(0, 0, VW, VH);

  /* graticule: appears only once the scale makes it meaningful */
  if (mpp < 15) {
    const stepDeg = mpp < 1.5 ? 0.002 : (mpp < 4 ? 0.005 : 0.01);
    ctx.strokeStyle = C.landEdge; ctx.lineWidth = 1; ctx.globalAlpha = (mpp < 10 ? 0.45 : 0.45 * (15 - mpp) / 5);
    ctx.beginPath();
    const lat0 = 38.6 + Math.floor(((EY.max - vy1) / 1e5) / stepDeg) * stepDeg;
    for (let la = lat0; la < 38.6 + (EY.max - vy0) / 1e5 + stepDeg; la += stepDeg) {
      const y = SY(EY.max - (la - 38.6) * 1e5);
      ctx.moveTo(0, y); ctx.lineTo(VW, y);
    }
    const lonMin = -27.42 + (vx0 / KX) / 1e5, lonMax = -27.42 + (vx1 / KX) / 1e5;
    for (let lo = Math.floor(lonMin / stepDeg) * stepDeg; lo < lonMax + stepDeg; lo += stepDeg) {
      const x = SX((lo + 27.42) * 1e5 * KX);

  }

  /* land */
  ctx.fillStyle = C.land;
  ctx.beginPath();
  for (const p of COAST) {
    if (p.b[2] < vx0 || p.b[0] > vx1 || p.b[3] < vy0 || p.b[1] > vy1) continue;
    const a = p.a;
    ctx.moveTo(SX(a[0]), SY(a[1]));
    for (let i = 2; i < a.length; i += 2) ctx.lineTo(SX(a[i]), SY(a[i + 1]));
    ctx.closePath();

  ctx.fill();
  ctx.strokeStyle = C.landEdge; ctx.lineWidth = 1;
  ctx.stroke();

  /* roads */

    ctx.strokeStyle = C.road2; ctx.lineWidth = 1;
    ctx.beginPath(); for (const p of ROADS.b) strokePath(p.a, p.b); ctx.stroke();
    ctx.strokeStyle = C.road; ctx.lineWidth = mpp < 12 ? 1.6 : 1.2;
    ctx.beginPath(); for (const p of ROADS.a) strokePath(p.a, p.b); ctx.stroke();
  }

  drawTiles();

  /* survey plans, at true geographic scale */
  const planAlpha = mpp > 3.2 ? 0 : (mpp < 1.6 ? 1 : (3.2 - mpp) / 1.6);
  if (planAlpha > 0.01) {
    ctx.lineWidth = Math.min(1.6, Math.max(0.7, 0.9 / Math.max(mpp, 0.05)));
    for (const pl of PLANS) {
      const b = pl.b;
      if (b[2] < vx0 || b[0] > vx1 || b[3] < vy0 || b[1] > vy1) continue;
      const isShow = !PLAN_HAS_CAVE.has(pl.n);
      ctx.globalAlpha = planAlpha * (isShow ? 0.55 : 0.95);
      ctx.strokeStyle = isShow ? C.ink3 : C.accent;
      ctx.beginPath();

        for (let i = 2; i < a.length; i += 2) ctx.lineTo(SX(a[i]), SY(a[i + 1]));
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    /* Openings ride the same fade as the plans they annotate, so they never
       clutter the island view. They are annotations, not primary targets: a
       tap on one opens the card of the cave the plan belongs to. */
    for (let i = 0; i < ENT_BY_PLAN.length; i++) {
      const pts = ENT_BY_PLAN[i];
      if (!pts.length) continue;
      const item = ITEM_BY_PLAN.get(i);
      const tappable = item && (item.show || state.filteredSet.has(item.i));
      for (const e of pts) {
        const x = SX(e.wx), y = SY(e.wy);
        if (x < -20 || x > VW + 20 || y < -20 || y > VH + 20) continue;
        drawEntPoint(ctx, x, y, e.p, planAlpha, 5);
        if (tappable && planAlpha > 0.5) hits.push({ x, y, item, r: 9 });
      }
    }
    ctx.globalAlpha = 1;
  }

  /* place names */
  const showMinor = mpp < 26;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const p of PLACES) {
    if (p.r === 2 && !showMinor) continue;
    let x = SX(p.w[0]); const y = SY(p.w[1]);
    if (x < -60 || x > VW + 60 || y < -20 || y > VH + 20) continue;
    ctx.font = (p.r === 1 ? '600 ' : '') + (p.r === 1 ? 11 : 10) + 'px ' + UIFONT;
    const tw = ctx.measureText(p.n).width;
    x = Math.max(tw / 2 + 6, Math.min(VW - tw / 2 - 6, x));
    ctx.lineWidth = 3; ctx.strokeStyle = C.land; ctx.globalAlpha = 0.85;
    ctx.strokeText(p.n, x, y);
    ctx.globalAlpha = 1;
    ctx.fillStyle = p.r === 1 ? C.ink2 : C.ink3;
    ctx.fillText(p.n, x, y);
  }

  /* show caves (orientation only) */
  for (const s of SHOW) {
    const x = SX(s.w[0]), y = SY(s.w[1]);
    if (x < -30 || x > VW + 30 || y < -30 || y > VH + 30) continue;
    ctx.strokeStyle = C.ink3; ctx.lineWidth = 1.4; ctx.fillStyle = C.paper;

  }

  /* selected label */
  if (state.sel && (state.sel.show || state.sel.located)) {
    const s = state.sel;
    const x = s.show ? SX(s.w[0]) : SX(s.wx), y = s.show ? SY(s.w[1]) : SY(s.wy);

      ctx.font = '600 12px ' + UIFONT; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      const w = ctx.measureText(s.n).width;

      ctx.globalAlpha = 1;

}
const UIFONT = 'system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
const PLAN_HAS_CAVE = new Set(DATA.caves.filter(c => c.pl !== undefined).map(c => c.n));

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h); c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y);
  c.closePath();
}

function drawMarker(c, x, y, cls, sel) {
  if (sel) {
    c.beginPath(); c.arc(x, y, 11, 0, 6.2832);
    c.strokeStyle = C.accent; c.lineWidth = 1.5; c.globalAlpha = .55; c.stroke(); c.globalAlpha = 1;
  }
  if (cls === 'A') {
    c.beginPath(); c.arc(x, y, 6, 0, 6.2832);
    c.fillStyle = C.accent; c.fill();
    c.strokeStyle = C.paper; c.lineWidth = 1.6; c.stroke();
  } else if (cls === 'B') {
    c.beginPath(); c.arc(x, y, 5.4, 0, 6.2832);
    c.fillStyle = C.paper; c.fill();
    c.strokeStyle = C.accent; c.lineWidth = 2.4; c.stroke();
  } else if (cls === 'C') {
    c.beginPath(); c.arc(x, y, 3.7, 0, 6.2832);
    c.fillStyle = C.ink2; c.fill();
    c.strokeStyle = C.paper; c.lineWidth = 1.3; c.stroke();
  } else {
    c.beginPath(); c.arc(x, y, 3.6, 0, 6.2832);
    c.fillStyle = C.paper; c.fill();
    c.strokeStyle = C.ink3; c.lineWidth = 1.5; c.stroke();
  }
}

/* Opening symbols, constant screen size: filled triangle = entrance,
   hollow triangle = exit, ring = skylight, ring with a core = pit.
   Medium confidence dims; low confidence goes dashed and takes a '?'. */
function entShape(c, x, y, r, kind) {
  c.beginPath();
  if (kind === 'entrance' || kind === 'exit') {
    c.moveTo(x, y - r * 1.15);
    c.lineTo(x + r, y + r * 0.78);
    c.lineTo(x - r, y + r * 0.78);
    c.closePath();
  } else {
    c.arc(x, y, r * 0.92, 0, 6.2832);
  }
}
function drawEntPoint(c, x, y, p, alpha, r) {
  const a = alpha * (p.cf === 'medium' ? 0.62 : 1);
  if (a < 0.02) return;
  c.lineJoin = 'round';
  /* paper halo, so the symbol survives sitting on top of a passage line */
  c.globalAlpha = a * 0.9; c.setLineDash([]);
  c.strokeStyle = C.paper; c.lineWidth = 3.2;
  entShape(c, x, y, r, p.k); c.stroke();
  c.globalAlpha = a;
  entShape(c, x, y, r, p.k);
  c.fillStyle = (p.k === 'entrance' && p.cf !== 'low') ? C.ink : C.paper;
  c.fill();
  c.setLineDash(p.cf === 'low' ? [2.4, 1.8] : []);
  c.strokeStyle = C.ink; c.lineWidth = 1.4;
  entShape(c, x, y, r, p.k); c.stroke();
  c.setLineDash([]);
  if (p.k === 'pit') {
    c.beginPath(); c.arc(x, y, r * 0.3, 0, 6.2832);
    c.fillStyle = C.ink; c.fill();
  }
  if (p.cf === 'low') {
    c.font = '600 9px ' + UIFONT;
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.lineWidth = 2.6; c.strokeStyle = C.paper;
    c.strokeText('?', x + r + 3, y - r);
    c.fillStyle = C.ink2; c.fillText('?', x + r + 3, y - r);
  }
  c.globalAlpha = 1;
}

function updateScale(mpp) {
  const targetPx = VW < 420 ? 62 : 84;
  const raw = mpp * targetPx;
  const pow = Math.pow(10, Math.floor(Math.log10(raw)));
  let nice = pow;
  for (const m of [1, 2, 5, 10]) { if (m * pow >= raw) { nice = m * pow; break; } }
  const px = nice / mpp;
  $('scaleRule').style.width = px.toFixed(0) + 'px';
  $('scaleLabel').textContent = nice >= 1000 ? fmtNum(nice / 1000) + ' km' : fmtNum(nice) + ' m';
