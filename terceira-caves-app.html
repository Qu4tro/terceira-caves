/* ------------------------------------------------------------------ input */
const ptrs = new Map();
let dragged = false, downT = 0, lastPan = null, vel = { x: 0, y: 0 }, inertiaRAF = 0, pinchDist = 0;

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  cancelAnimationFrame(inertiaRAF); cancelAnimationFrame(flyRAF);
  if (ptrs.size === 1) { dragged = false; downT = performance.now(); lastPan = { x: e.clientX, y: e.clientY, t: downT }; vel = { x: 0, y: 0 }; canvas.classList.add('drag'); }
  if (ptrs.size === 2) { const p = [...ptrs.values()]; pinchDist = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y); vel = { x: 0, y: 0 }; }
});
canvas.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  const prev = ptrs.get(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 1) {
    const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
    if (Math.abs(e.clientX - lastPan.x) + Math.abs(e.clientY - lastPan.y) > 5) dragged = true;
    userMoved = true;
    cam.x -= dx / cam.k; cam.y -= dy / cam.k;
    const now = performance.now(), dt = Math.max(8, now - lastPan.t);
    vel.x = dx / dt; vel.y = dy / dt;
    lastPan = { x: e.clientX, y: e.clientY, t: now };
    clampCam(); requestDraw();
  } else if (ptrs.size === 2) {
    dragged = true;
    const p = [...ptrs.values()];
    const d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
    if (pinchDist > 0 && d > 0) {
      const r = canvas.getBoundingClientRect();
      zoomAt((p[0].x + p[1].x) / 2 - r.left, (p[0].y + p[1].y) / 2 - r.top, d / pinchDist);
    }
    pinchDist = d;
  }
});
function endPointer(e) {
  if (!ptrs.has(e.pointerId)) return;
  const wasSingle = ptrs.size === 1;
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) { pinchDist = 0; vel = { x: 0, y: 0 }; }
  if (ptrs.size === 1) { const p = [...ptrs.values()][0]; lastPan = { x: p.x, y: p.y, t: performance.now() }; }
  if (ptrs.size === 0) {
    canvas.classList.remove('drag');
    if (!dragged && performance.now() - downT < 500) {
      const r = canvas.getBoundingClientRect();
      pick(e.clientX - r.left, e.clientY - r.top);
    } else if (wasSingle) {
      startInertia();
    }
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

function startInertia() {
  let vx = vel.x, vy = vel.y;
  if (Math.hypot(vx, vy) < 0.12) return;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let last = performance.now();
  const step = now => {
    const dt = Math.min(40, now - last); last = now;
    cam.x -= vx * dt / cam.k; cam.y -= vy * dt / cam.k;
    vx *= Math.pow(0.9955, dt); vy *= Math.pow(0.9955, dt);
    clampCam(); drawNow();
    if (Math.hypot(vx, vy) > 0.02) inertiaRAF = requestAnimationFrame(step);
  };
  inertiaRAF = requestAnimationFrame(step);
}

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  const d = e.deltaMode === 1 ? e.deltaY * 18 : (e.deltaMode === 2 ? e.deltaY * 400 : e.deltaY);
  zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-d * 0.0016));
}, { passive: false });

canvas.addEventListener('dblclick', e => {
  const r = canvas.getBoundingClientRect();
  zoomAt(e.clientX - r.left, e.clientY - r.top, 2);
});

function pick(px, py) {
  let best = null, bestD = Infinity;
  for (const h of hits) {
    const d = Math.hypot(h.x - px, h.y - py);
    if (d < h.r && d < bestD) { bestD = d; best = h.item; }
  }
  select(best, false);
}

$('zIn').onclick = () => zoomAt(VW / 2, VH / 2, 1.75);
$('zOut').onclick = () => zoomAt(VW / 2, VH / 2, 1 / 1.75);
$('zFit').onclick = () => { fit(true); userMoved = false; };

function syncOsm() {
  $('zOsm').setAttribute('aria-pressed', OSM ? 'true' : 'false');
  $('osmAttr').hidden = !OSM;
}
$('zOsm').onclick = () => {
  OSM = !OSM;
  try { localStorage.setItem(OSM_KEY, OSM ? '1' : '0'); } catch (_) { }
  syncOsm(); requestDraw();
};

/* ------------------------------------------------------------------ selection */
function select(item, recentre) {
  state.sel = item || null;
  if (!item) { closeSheet(); requestDraw(); renderList(); return; }
  renderDetail(item);
  openSheet();
  if (recentre) focusOn(item);
  requestDraw(); renderList();
}

/* Frame a cave so its whole surveyed passage fits — and so the entrance marker
   stays in frame, which is how you see where the two disagree. */
function focusOn(item) {
  if (!item.show && !item.located) return;    /* nothing to fly to */
  const wx = item.show ? item.w[0] : item.wx, wy = item.show ? item.w[1] : item.wy;
  let x0 = wx, x1 = wx, y0 = wy, y1 = wy;
  if (item.pl !== undefined) {
    const b = PLANS[item.pl].b;
    x0 = Math.min(x0, b[0]); y0 = Math.min(y0, b[1]);
    x1 = Math.max(x1, b[2]); y1 = Math.max(y1, b[3]);
  }
  let w = Math.max(x1 - x0, 40), h = Math.max(y1 - y0, 40);
  if (item.pl === undefined) { w = Math.max(w, 620); h = Math.max(h, 620); }
  const pad = 60;
  let k = Math.min((Math.max(VW - pad * 2, 60)) / w, (Math.max(VH - pad * 2, 60)) / h);
  k = Math.max(fitK * 1.2, Math.min(fitK * 700, k));
  flyTo({ x: (x0 + x1) / 2, y: (y0 + y1) / 2, k });
}

function openSheet() { $('sheet').classList.add('open'); }
function closeSheet() {
  $('sheet').classList.remove('open');
  if (matchMedia('(min-width:880px)').matches) renderPlaceholder();
}
$('sheetClose').onclick = () => { state.sel = null; closeSheet(); requestDraw(); renderList(); };

/* swipe-down to dismiss */
(function () {
  const grab = $('grab'), sheet = $('sheet');
  let sy = 0, on = false;
  grab.addEventListener('pointerdown', e => { on = true; sy = e.clientY; grab.setPointerCapture(e.pointerId); sheet.style.transition = 'none'; });
  grab.addEventListener('pointermove', e => { if (!on) return; const d = Math.max(0, e.clientY - sy); sheet.style.transform = 'translateY(' + d + 'px)'; });
  const up = e => {
    if (!on) return; on = false;
    const d = Math.max(0, e.clientY - sy);
    sheet.style.transition = ''; sheet.style.transform = '';
    if (d > 70) { state.sel = null; closeSheet(); requestDraw(); renderList(); }
  };
  grab.addEventListener('pointerup', up); grab.addEventListener('pointercancel', up);
})();

/* ------------------------------------------------------------------ detail */
/* Coordinates keep decimal points in both languages — they are GPS values,
   not prose numbers. Everything else follows the locale: EN 2,713 / 250.5,
   PT 2\u202f713 / 250,5 (narrow no-break space as the thousands separator). */
function fmtCoord(la, lo) { return la.toFixed(5) + ', ' + lo.toFixed(5); }
function fmtNum(v) {
  if (v == null) return null;
  const neg = v < 0, s = String(Math.abs(v));
  const dot = s.indexOf('.');
  const ip = dot < 0 ? s : s.slice(0, dot), fp = dot < 0 ? '' : s.slice(dot + 1);
  const grp = LANG === 'pt' ? '\u202f' : ',', dec = LANG === 'pt' ? ',' : '.';
  let g = '';
  for (let i = ip.length; i > 0; i -= 3) g = ip.slice(Math.max(0, i - 3), i) + (g ? grp + g : '');
  return (neg ? '-' : '') + g + (fp ? dec + fp : '');
}
function fmtInt(v) { return fmtNum(v); }
function fmtLen(v) { return v == null ? null : fmtNum(v); }

function renderPlaceholder() {
  $('sheetBody').innerHTML =
    '<div class="placeholder"><b>' + t('ph.title') + '</b>' + t('ph.body') + '</div>';
}

/* One symbol generator for the plan plate, the legend and the per-cave list.
   Coordinates are whatever the caller's user space is: plan metres or a
   18-unit legend box. */
function entSymSVG(p, x, y, r) {
  const f = n => String(Math.round(n * 100) / 100);
  const tri = p.k === 'entrance' || p.k === 'exit';
  const shape = tri
    ? '<path d="M' + f(x) + ' ' + f(y - r * 1.15) + 'L' + f(x + r) + ' ' + f(y + r * 0.78) +
      'L' + f(x - r) + ' ' + f(y + r * 0.78) + 'Z"'
    : '<circle cx="' + f(x) + '" cy="' + f(y) + '" r="' + f(r * 0.92) + '"';
  const solid = p.k === 'entrance' && p.cf !== 'low';
  return '<g class="es' + (p.cf === 'medium' ? ' med' : (p.cf === 'low' ? ' low' : '')) + '">' +
    shape + ' class="halo"/>' +
    shape + ' class="sym' + (solid ? ' solid' : '') + '"/>' +
    (p.k === 'pit' ? '<circle class="dot" cx="' + f(x) + '" cy="' + f(y) + '" r="' + f(r * 0.3) + '"/>' : '') +
    (p.cf === 'low' ? '<text class="qm" x="' + f(x + r * 1.45) + '" y="' + f(y - r * 0.95) +
      '" style="font-size:' + f(r * 1.5) + 'px">?</text>' : '') +
    '</g>';
}

/* the openings listed under the plate: kind, confidence, method, note */
function entListHTML(name) {
  const pts = ENTRANCES[name];
  if (!pts || !pts.length) return '';
  let s = '<div class="ents"><div class="k">' + t('ent.title') + ' &middot; ' + fmtInt(pts.length) + '</div><ul>';
  pts.forEach((p, i) => {
    s += '<li><span class="gl"><svg viewBox="0 0 18 18" aria-hidden="true">' +
      entSymSVG(p, 9, 9.5, 5.4) + '</svg></span><div class="bd">' +
      '<div class="h">' + t('ent.kind.' + p.k) +
      ' <span class="cf">&middot; ' + t('ent.conf.' + p.cf) + '</span></div>' +
      '<span class="m">' + t('ent.method.' + p.m) + '</span>' +
      '<p class="nt">' + esc(entNote(name, i)) + '</p></div></li>';
  });
  return s + '</ul></div>';
}

/* Photos come from the optional photos.js sidecar, keyed by exact cave name.
   No sidecar, no key, no entry -> nothing renders. A file that 404s hides its
   own figure via onerror, leaving the rest of the card intact. */
function photosHTML(c) {
  const ps = (window.PHOTOS || {})[c.n];
  if (!ps || !ps.length) return '';
  let s = '<div class="field"><div class="k">' + t('detail.photos') + '</div>';
  for (const p of ps) {
    if (!p || !p.f) continue;
    const src = 'photos/' + esc(p.f);
    const cap = LANG === 'pt' ? (p.pt || p.en || '') : (p.en || p.pt || '');
    let cred = esc(cap);
    if (p.credit) cred += (cred ? ' &mdash; ' : '') + esc(p.credit);
    if (p.license) cred += (cred ? ' &middot; ' : '') + esc(p.license);
    if (p.url) cred += (cred ? ' &middot; ' : '') +
      '<a href="' + esc(p.url) + '" target="_blank" rel="noopener">' + t('photo.source') + '</a>';
    s += '<figure class="photo"><a href="' + src + '" target="_blank" rel="noopener">' +
      '<img src="' + src + '" alt="' + esc(cap) + '" loading="lazy"' +
      ' onerror="this.closest(\'figure\').hidden=true"></a>' +
      '<figcaption>' + cred + '</figcaption></figure>';
  }
  return s + '</div>';
}

/* The 2024 assessment: the four 0-5 criteria the class letter is computed from
   (Resolução 163/2024, anexo II), plus the two cross-section maxima SIGCAVA
   carries. Comes from the optional cavedata.js sidecar, so no sidecar, no
   block. A null score is "no information available" in the diploma, not zero. */
function sigcavaHTML(c) {
  const e = (window.CAVEDATA || {})[c.n];
  const s = e && e.sg;
  if (!s) return '';
  if (s.g == null && s.b == null && s.d == null && s.i == null) return '';
  const cell = (k, v) => '<div class="stat"><div class="k">' + t('sig.' + k) + '</div>' +
    '<div class="v' + (v == null ? ' none' : '') + '">' + (v == null ? '&mdash;' : fmtInt(v)) + '</div></div>';
  let h = '<div class="field"><div class="k">' + t('sig.title') + '</div>' +
    '<div class="stats q4">' + cell('geologia', s.g) + cell('biologia', s.b) +
    cell('dimensao', s.d) + cell('integridade', s.i) + '</div>';
  const dims = [];
  if (s.h != null) dims.push(t('sig.hmax') + ' ' + fmtNum(s.h) + ' m');
  if (s.w != null) dims.push(t('sig.wmax') + ' ' + fmtNum(s.w) + ' m');
  if (dims.length) h += '<p class="prec"><b style="color:var(--ink-2)">' + dims.join(' &middot; ') + '</b></p>';
  h += '<p class="prec">' + t('sig.legend') + (s.topo ? ' ' + t('sig.topo') : '') + '</p>' +
    '<p class="prec" style="font-family:var(--f-mono);font-size:11px">' + t('sig.src') +
    (s.id ? ' &middot; ' + esc(s.id) : '') + '</p></div>';
  return h;
}

/* Arthropods published for this cave, cave-adapted and endemic ones first and
   rail-marked. Also from cavedata.js; a cave with no list has not been
   surveyed, which the note under the list says out loud. */
function faunaHTML(c) {
  const e = (window.CAVEDATA || {})[c.n];
  const fa = e && e.fa;
  if (!fa || !fa.length) return '';
  let h = '<div class="field"><div class="k">' + t('fauna.title') + ' &middot; ' + fmtInt(fa.length) +
    '</div><ul class="fauna">';
  for (const f of fa) {
    if (!f || !f.n) continue;
    const hi = !!f.ec || String(f.bg || '').indexOf('endemic') === 0;
    const bits = [];
    if (f.ec) bits.push(t('fauna.ec.' + f.ec));
    if (f.bg) bits.push(t('fauna.bg.' + f.bg));
    const taxo = [f.or, f.fa].filter(Boolean).map(esc).join(' &middot; ');
    const cn = LANG === 'pt' ? (f.pt || '') : (f.en || '');
    h += '<li' + (hi ? ' class="hi"' : '') + '><span class="sp"><i>' + esc(f.n) + '</i>' +
      (f.au ? ' <span class="au">' + esc(f.au) + '</span>' : '') + '</span>' +
      (taxo ? '<span class="m">' + taxo + '</span>' : '') +
      (bits.length ? '<span class="tr">' + bits.join(' &middot; ') + '</span>' : '') +
      (cn ? '<span class="cn">' + esc(cn) + '</span>' : '') + '</li>';
  }
  return h + '</ul><p class="prec">' + t('fauna.note') + '</p>' +
    '<p class="prec">' + t('fauna.noteM') + '</p>' +
    '<p class="prec" style="font-family:var(--f-mono);font-size:11px">' + t('fauna.src') + '</p></div>';
}

/* One prose block of the cavedata.js sidecar — ac (how you get in), gl (a
   sentence of geology) or ds (what the cave is). Each carries its own source
   line, because they come from a dozen different publications; nothing here is
   inferred, so a cave with no sourced fact simply renders nothing. */
function proseHTML(c, key, titleKey) {
  const e = (window.CAVEDATA || {})[c.n];
  const b = e && e[key];
  if (!b) return '';
  const txt = LANG === 'pt' ? (b.pt || b.en) : (b.en || b.pt);
  if (!txt) return '';
  return '<div class="field"><div class="k">' + t(titleKey) + '</div>' +
    '<div class="v">' + esc(txt) + '</div>' +
    (b.sr ? '<p class="prec" style="font-family:var(--f-mono);font-size:11px">' +
      esc(b.sr) + '</p>' : '') + '</div>';
}

/* Geology: the mapped volcanic system and flow age ride on the CSV row, the
   optional sentence on the sidecar. Either half can be missing. */
function geologyHTML(c) {
  const prose = proseHTML(c, 'gl', 'geo.title');
  if (!c.vs && !c.ag) return prose;
  let h = '<div class="field"><div class="k">' + t('geo.title') + '</div>' +
    '<div class="v"><b style="color:var(--ink)">' + esc(c.vs || '') + '</b>' +
    (c.ag ? ' &middot; ' + esc(c.ag) : '') + '</div>';
  const e = (window.CAVEDATA || {})[c.n], b = e && e.gl;
  if (b) {
    const txt = LANG === 'pt' ? (b.pt || b.en) : (b.en || b.pt);
    if (txt) h += '<p class="prec">' + esc(txt) + '</p>';
    if (b.sr) h += '<p class="prec" style="font-family:var(--f-mono);font-size:11px">' + esc(b.sr) + '</p>';
  }
  h += '<p class="prec">' + t('geo.src') + '</p>';
  return h + '</div>';
}

function planSVG(idx, muted) {
  const pl = PLANS[idx];
  const pad = Math.max(4, Math.max(pl.w, pl.h) * 0.05);
  const w = pl.w + pad * 2, h = pl.h + pad * 2;
  const d = pl.raw.map(f => {
    let s = 'M' + (f[0] / 10 + pad).toFixed(1) + ' ' + (pl.h - f[1] / 10 + pad).toFixed(1);
    for (let i = 2; i < f.length; i += 2) s += 'L' + (f[i] / 10 + pad).toFixed(1) + ' ' + (pl.h - f[i + 1] / 10 + pad).toFixed(1);
    return s;
  }).join('');
  /* scale bar: a round number that fits inside a quarter of the drawing */
  const raw = Math.max(pl.w, pl.h) / 4;
  const pow = Math.pow(10, Math.floor(Math.log10(raw)));
  let nice = pow / 2;
  for (const m of [1, 2, 5, 10]) { if (m * pow <= raw) nice = m * pow; }
  const by = h - pad * 0.35, bx = pad * 0.5;
  return '<div class="plan' + (muted ? ' muted' : '') + '">' +
    '<div class="cap"><span class="t">' + t('plan.caption') + '</span><span class="s">' + fmtInt(Math.round(pl.w)) + '&thinsp;&times;&thinsp;' + fmtInt(Math.round(pl.h)) + '&thinsp;m</span></div>' +
    '<svg viewBox="0 0 ' + w.toFixed(1) + ' ' + (h + pad).toFixed(1) + '" role="img" aria-label="' + esc(t('plan.aria')) + '">' +
    '<g class="drawn"><path class="pl" d="' + d + '"/></g>' +
    entPlateSVG(idx, pl, pad) +
    '<g><path class="ax" d="M' + bx.toFixed(1) + ' ' + (by - 1.6).toFixed(1) + 'v3.2M' + bx.toFixed(1) + ' ' + by.toFixed(1) + 'h' + nice.toFixed(1) + 'M' + (bx + nice).toFixed(1) + ' ' + (by - 1.6).toFixed(1) + 'v3.2"/>' +
    '<text class="axt" x="' + (bx + nice + 2).toFixed(1) + '" y="' + (by + 2.4).toFixed(1) + '" style="font-size:' + (Math.max(pl.w, pl.h) * 0.035).toFixed(1) + 'px">' + fmtNum(nice) + '&#8201;m</text></g>' +
    '<g><path class="ax" d="M' + (w - pad * 0.6).toFixed(1) + ' ' + (by).toFixed(1) + 'v-' + (Math.max(pl.w, pl.h) * 0.075).toFixed(1) + '"/>' +
    '<text class="axt" text-anchor="middle" x="' + (w - pad * 0.6).toFixed(1) + '" y="' + (by - Math.max(pl.w, pl.h) * 0.085).toFixed(1) + '" style="font-size:' + (Math.max(pl.w, pl.h) * 0.04).toFixed(1) + 'px">N</text></g>' +
    '</svg></div>';
}

/* Plan-local metres -> plate user space, the same mapping the passage uses. */
function entPlateSVG(idx, pl, pad) {
  const pts = ENT_BY_PLAN[idx];
  if (!pts || !pts.length) return '';
  const r = Math.max(0.5, Math.max(pl.w, pl.h) * 0.017);
  return '<g>' + pts.map(e => entSymSVG(e.p, e.mx + pad, pl.h - e.my + pad, r)).join('') + '</g>';
}

function esc(s) { return String(s).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m])); }

function renderDetail(c) {
  const b = $('sheetBody');
  if (c.show) {
    b.innerHTML =
      '<h2 class="d-name">' + esc(c.n) + '</h2>' +
      '<p class="d-where">' + t('detail.showWhere') + '</p>' +
      '<div class="d-tags"><span class="tag">' + t('detail.tagOrientation') + '</span><span class="tag">' + t('detail.tagNotInCat') + '</span></div>' +
      (c.pl !== undefined ? planSVG(c.pl, true) : '') +
      entListHTML(c.n) +
      sigcavaHTML(c) +
      faunaHTML(c) +
      '<div class="field"><div class="k">' + t('detail.whyHere') + '</div><div class="v">' + t('detail.whyBody') + '</div></div>';
    b.scrollTop = 0; return;
  }
  const cls = c.c || '';
  const dot = cls === 'A' || cls === 'B' ? 'var(--accent)' : (cls === 'C' ? 'var(--ink-2)' : 'var(--ink-3)');
  const len = fmtLen(c.L), dep = fmtLen(c.D);
  const precKey = c.p;
  let h = '';
  h += '<h2 class="d-name">' + esc(c.n) + '</h2>';
  /* Aliases sit directly under the name because several of them are what the
     cave is actually called locally — "Ratões", "Terra Mole II". */
  if (c.al && c.al.length)
    h += '<p class="d-alias">' + t('detail.aliases') + ' ' + c.al.map(esc).join(' &middot; ') + '</p>';
  const where = [c.f, c.co, clusterName(c.k)].filter(Boolean).map(esc).join(' &middot; ');
  if (where) h += '<p class="d-where">' + where + '</p>';
  h += '<div class="d-tags">' +
    '<span class="tag' + (cls === 'A' || cls === 'B' ? ' hi' : '') + '"><i class="dot" style="background:' + dot + '"></i>' + classLabel(cls) + '</span>' +
    '<span class="tag">' + t('precLabel.' + precKey) + '</span>' +
    (c.sh ? '<span class="tag hi">' + t('detail.tagShow') + '</span>' : '') +
    (c.pl !== undefined ? '<span class="tag hi">' + t('detail.tagPlan') + '</span>' : '') +
    '</div>';
  if (c.sh) h += '<p class="d-where">' + t('detail.showWhere') + '</p>';
  if (c.pl !== undefined) h += planSVG(c.pl, false);
  h += entListHTML(c.n);
  const elev = c.el == null ? null : fmtNum(c.el);
  const stat = (k, v) => '<div class="stat"><div class="k">' + t(k) + '</div><div class="v' +
    (v ? '' : ' none') + '">' + (v ? v + '<small>m</small>' : t('detail.none')) + '</div></div>';
  h += '<div class="stats' + (elev ? ' q3' : '') + '">' + stat('detail.length', len) +
    stat('detail.depth', dep) + (elev ? stat('detail.elev', elev) : '') + '</div>';
  if (!c.located) {
    h += '<div class="field"><div class="k">' + t('detail.coords') + '</div>' +
      '<div class="v none">' + t('detail.noCoords') + '</div>' +
      '<p class="prec">' + t('precNote.unlocated') + '</p>' +
      '<p class="prec" style="font-family:var(--f-mono);font-size:11px">' + t('detail.record') + esc(recordText(c)) + '</p></div>';
  } else
  h += '<div class="field"><div class="k">' + t('detail.coords') + '</div>' +
    '<div class="coord"><code id="coordTxt">' + fmtCoord(c.la, c.lo) + '</code>' +
    '<button class="copy" id="copyBtn" type="button" data-c="' + fmtCoord(c.la, c.lo) + '">' +
    '<svg viewBox="0 0 12 12" aria-hidden="true"><rect x="1.2" y="1.2" width="7" height="7" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M4 10.8h6.8V4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>' +
    '<span>' + t('detail.copy') + '</span></button></div>' +
    '<p class="prec"><b style="color:var(--ink-2)">' + t('precLabel.' + precKey) + (c.halo ? ' &middot; ±' + fmtInt(c.halo) + ' m' : '') + '.</b> ' + t('precNote.' + precKey) + '</p>' +
    '<p class="prec" style="font-family:var(--f-mono);font-size:11px">' + t('detail.record') + esc(recordText(c)) + '</p></div>';
  h += '<div class="field"><div class="k">' + t('detail.legalClass') + '</div>' +
    '<div class="v"><b style="color:var(--ink)">' + classLabel(cls) + '</b> &mdash; ' + classMeaning(cls) + '</div>' +
    '<p class="prec">' + classRegime(cls) + '</p>' +
    '<p class="prec">' + t('classRegime.all') + '</p>' +
    '<p class="prec" style="font-family:var(--f-mono);font-size:11px">' + t('classRegime.src') + '</p></div>';
  if (elev) h += '<p class="prec" style="margin:-8px 0 16px">' + t('detail.elevNote') + '</p>';
  h += proseHTML(c, 'ds', 'desc.title');
  h += proseHTML(c, 'ac', 'access.title');
  h += geologyHTML(c);
  h += sigcavaHTML(c);
  const note = caveNote(c);
  if (note) h += '<div class="field"><div class="k">' + t('detail.notes') + '</div><div class="v">' + esc(note) + '</div></div>';
  h += faunaHTML(c);
  h += photosHTML(c);
  h += '<div class="field"><div class="k">' + t('detail.source') + '</div><div class="v" style="font-family:var(--f-mono);font-size:12px">' + esc(sourceText(c)) + '</div></div>';
  if (c.located)
    h += '<button class="gobtn" id="goMap" type="button"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1.6c-2 0-3.6 1.6-3.6 3.6C3.4 8 7 12.4 7 12.4S10.6 8 10.6 5.2c0-2-1.6-3.6-3.6-3.6z" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="7" cy="5.2" r="1.3" fill="currentColor"/></svg>' + t('detail.showOnMap') + '</button>';
  b.innerHTML = h;
  b.scrollTop = 0;

  const cp = $('copyBtn');
  if (cp) cp.onclick = () => {
    const txt = cp.dataset.c;
    const done = () => { cp.classList.add('ok'); cp.querySelector('span').textContent = t('detail.copied'); setTimeout(() => { cp.classList.remove('ok'); cp.querySelector('span').textContent = t('detail.copy'); }, 1600); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, fallback);
    else fallback();
    function fallback() {
      const ta = el('textarea'); ta.value = txt; ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (_) { }
      document.body.removeChild(ta);
    }
  };
  const gm = $('goMap');
  if (gm) gm.onclick = () => { setView('map'); focusOn(c); };
}

/* ------------------------------------------------------------------ list */
const CLASS_RANK = { A: 0, B: 1, C: 2, D: 3, '': 4 };
function sortRows(a) {
  const s = state.sort, o = a.slice();
  const LOC = LANG === 'pt' ? 'pt-PT' : 'en';
  const byName = (x, y) => x.n.localeCompare(y.n, 'pt');   /* names are Portuguese in both languages */
  if (s === 'len-') o.sort((x, y) => (y.L ?? -1) - (x.L ?? -1) || byName(x, y));
  else if (s === 'len+') o.sort((x, y) => (x.L ?? 1e9) - (y.L ?? 1e9) || byName(x, y));
  else if (s === 'dep-') o.sort((x, y) => (y.D ?? -1) - (x.D ?? -1) || byName(x, y));
  else if (s === 'cls') o.sort((x, y) => CLASS_RANK[x.c] - CLASS_RANK[y.c] || (y.L ?? -1) - (x.L ?? -1) || byName(x, y));
  else if (s === 'area') o.sort((x, y) => clusterName(x.k).localeCompare(clusterName(y.k), LOC) || byName(x, y));
  else o.sort(byName);
  return o;
}
function markerSVG(cls) {
  if (cls === 'A') return '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.4" fill="var(--accent)"/></svg>';
  if (cls === 'B') return '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="4.4" fill="var(--paper)" stroke="var(--accent)" stroke-width="2.2"/></svg>';
  if (cls === 'C') return '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3.4" fill="var(--ink-2)"/></svg>';
  return '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3.3" fill="var(--paper)" stroke="var(--ink-3)" stroke-width="1.6"/></svg>';
}
function renderList() {
  const ul = $('rows');
  const rows = sortRows(state.filtered);
  if (!rows.length) {
    ul.innerHTML = '<li><div class="empty"><b>' + t('empty.title') + '</b>' + t('empty.body') + '</div></li>';
    return;
  }
  const max = Math.max(...rows.map(r => r.L || 0), 1);
  let h = '';
  for (const c of rows) {
    const len = fmtLen(c.L);
    const sel = state.sel && state.sel.i === c.i;
    h += '<li><button class="row" type="button" data-i="' + c.i + '"' + (sel ? ' aria-current="true"' : '') + '>' +
      '<span class="gl">' + markerSVG(c.c) + '</span>' +
      '<span><span class="nm">' + esc(c.n) + '</span>' +
      '<span class="meta">' + esc(clusterName(c.k)) +
      '<span class="sep">&middot;</span>' + classLabel(c.c) +
      (c.p === 'approx' ? '<span class="sep">&middot;</span>' + t('row.approx') + ' ±' + fmtInt(c.halo) + ' m' : '') +
      (c.p === 'unlocated' ? '<span class="sep">&middot;</span><span class="nofix">' + t('row.unlocated') + '</span>' : '') +
      (c.pl !== undefined ? '<span class="sep">&middot;</span><span style="color:var(--accent)">' + t('row.plan') + '</span>' : '') +
      '</span></span>' +
      '<span class="val">' + (len ? len + '<span class="u">&#8201;m</span>' : '<span class="u">&mdash;</span>') +
      (c.D ? '<br><span class="u">&#8209;' + fmtNum(c.D) + '&#8201;m</span>' : '') + '</span>' +
      (c.L ? '<span class="bar"><i style="width:' + Math.max(1.2, (c.L / max) * 100) + '%"></i></span>' : '') +
      '</button></li>';
  }
  ul.innerHTML = h;
}
$('rows').addEventListener('click', e => {
  const b = e.target.closest('.row'); if (!b) return;
  const c = DATA.caves.find(x => x.i === +b.dataset.i);
  select(c, false);
});
$('sort').onchange = e => { state.sort = e.target.value; renderList(); };

/* ------------------------------------------------------------------ filters */
function chip(label, count, pressed, glyph) {
  const b = el('button', 'chip'); b.type = 'button';
  b.setAttribute('aria-pressed', pressed ? 'true' : 'false');
  if (glyph != null) { const d = el('span', 'gl'); d.innerHTML = markerSVG(glyph); b.appendChild(d); }
  b.appendChild(document.createTextNode(label));
  const c = el('span', 'ct', fmtInt(count)); b.appendChild(c);
  return b;
}
function buildFilters() {
  const cw = $('fClass'); cw.innerHTML = '';
  for (const k of CLASS_KEYS) {
    const n = DATA.caves.filter(c => c.c === k).length;
    if (!n) continue;
    const b = chip(classLabel(k), n, state.cls.has(k), k);
    b.onclick = () => { toggle(state.cls, k); b.setAttribute('aria-pressed', state.cls.has(k)); applyFilters(); };
    cw.appendChild(b);
  }
  const pw = $('fPrec'); pw.innerHTML = '';
  PREC_KEYS.forEach(k => {
    const n = DATA.caves.filter(c => precBucket(c) === k).length;
    if (!n) return;
    const b = chip(t('prec.' + k), n, state.prec.has(k), null);
    b.onclick = () => { toggle(state.prec, k); b.setAttribute('aria-pressed', state.prec.has(k)); applyFilters(); };
    pw.appendChild(b);
  });
  const aw = $('fArea'); aw.innerHTML = '';
  for (const cl of DATA.clusters) {
    const n = DATA.caves.filter(c => c.k === cl.k).length;
    if (!n) continue;
    const b = chip(clusterName(cl.k), n, state.area.has(cl.k), null);
    b.onclick = () => { toggle(state.area, cl.k); b.setAttribute('aria-pressed', state.area.has(cl.k)); applyFilters(); };
    aw.appendChild(b);
  }
}
function toggle(set, v) { set.has(v) ? set.delete(v) : set.add(v); }
$('fclear').onclick = () => { state.cls.clear(); state.prec.clear(); state.area.clear(); buildFilters(); applyFilters(); };
$('fbtn').onclick = () => {
  const open = $('tray').classList.toggle('open');
  $('fbtn').setAttribute('aria-expanded', open ? 'true' : 'false');
};
document.addEventListener('click', e => {
  if ($('tray').classList.contains('open') && !e.target.closest('#tray') && !e.target.closest('#fbtn')) {
    $('tray').classList.remove('open'); $('fbtn').setAttribute('aria-expanded', 'false');
  }
});

let qt = 0;
$('q').addEventListener('input', e => {
  state.q = e.target.value;
  $('searchWrap').classList.toggle('has', state.q.length > 0);
  clearTimeout(qt); qt = setTimeout(applyFilters, 110);
});
$('qclr').onclick = e => { e.preventDefault(); $('q').value = ''; state.q = ''; $('searchWrap').classList.remove('has'); applyFilters(); $('q').focus(); };

/* ------------------------------------------------------------------ views */
function setView(v) {
  state.view = v;
  const map = v === 'map';
  $('list').hidden = map;
  canvas.style.display = map ? 'block' : 'none';
  document.querySelector('.mapui').style.display = map ? 'block' : 'none';
  $('vMap').setAttribute('aria-pressed', map ? 'true' : 'false');
  $('vList').setAttribute('aria-pressed', map ? 'false' : 'true');
  if (map) { resize(); }
}
$('vMap').onclick = () => setView('map');
$('vList').onclick = () => setView('list');

/* legend */
$('legToggle').onclick = () => {
  const l = $('legend'), open = l.dataset.open !== '1';
  l.dataset.open = open ? '1' : '0';
  $('legToggle').setAttribute('aria-expanded', open ? 'true' : 'false');
};
function buildLegend() {
  $('legBody').innerHTML = [['A', 'legend.A'], ['B', 'legend.B'], ['C', 'legend.C'], ['', 'legend.D']]
    .map(([k, key]) => '<div class="row"><span class="gl">' + markerSVG(k) + '</span><span>' + t(key) + '</span></div>').join('') +
    '<div class="row"><span class="gl"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="7" fill="none" stroke="var(--ink-3)" stroke-width="1.2" stroke-dasharray="3 3"/></svg></span><span>' + t('legend.halo') + '</span></div>' +
    '<div class="row"><span class="gl"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 14c3-1 2-6 5-7s4 2 7 1" fill="none" stroke="var(--accent)" stroke-width="1.3" stroke-linecap="round"/></svg></span><span>' + t('legend.plan') + '</span></div>' +
    (DATA.show.length ? '<div class="row"><span class="gl"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="5.5" y="5.5" width="7" height="7" fill="var(--paper)" stroke="var(--ink-3)" stroke-width="1.4"/></svg></span><span>' + t('legend.show') + '</span></div>' : '') +
    [['entrance', 'legend.ent'], ['exit', 'legend.exit'], ['skylight', 'legend.sky'], ['pit', 'legend.pit']]
      .map(([k, key]) => '<div class="row"><span class="gl"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">' +
        entSymSVG({ k, cf: 'high' }, 9, 9.5, 5.4) + '</svg></span><span>' + t(key) + '</span></div>').join('') +
    '<p class="note">' + t('legend.note') + ' ' + t('legend.entNote') + '</p>';
}

if (matchMedia('(min-width:880px)').matches) { $('legend').dataset.open = '1'; $('legToggle').setAttribute('aria-expanded', 'true'); }

/* about modal */
function openModal() { $('modal').classList.add('open'); $('modalClose').focus(); }
function closeModal() { $('modal').classList.remove('open'); $('aboutBtn').focus(); }
$('aboutBtn').onclick = openModal;
$('modalClose').onclick = closeModal;
$('scrim').onclick = closeModal;
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if ($('modal').classList.contains('open')) closeModal();
    else if ($('tray').classList.contains('open')) { $('tray').classList.remove('open'); $('fbtn').setAttribute('aria-expanded', 'false'); }
    else if (state.sel && !matchMedia('(min-width:880px)').matches) { state.sel = null; closeSheet(); requestDraw(); renderList(); }
  }
});

/* ------------------------------------------------------------------ language
   One pass rewrites every static node from the dictionary, then re-renders the
   generated chrome. No component branches on language on its own. */
function applyLang(lang) {
  LANG = (lang === 'pt') ? 'pt' : 'en';
  try { localStorage.setItem(LANG_KEY, LANG); } catch (_) { }
  document.documentElement.lang = LANG === 'pt' ? 'pt-PT' : 'en';
  document.title = t('doc.title');
  for (const n of document.querySelectorAll('[data-t]')) n.textContent = t(n.dataset.t);
  for (const n of document.querySelectorAll('[data-t-html]')) n.innerHTML = t(n.dataset.tHtml);
  for (const n of document.querySelectorAll('[data-t-ph]')) n.placeholder = t(n.dataset.tPh);
  for (const n of document.querySelectorAll('[data-t-aria]')) n.setAttribute('aria-label', t(n.dataset.tAria));
  $('lgEn').setAttribute('aria-pressed', LANG === 'en' ? 'true' : 'false');
  $('lgPt').setAttribute('aria-pressed', LANG === 'pt' ? 'true' : 'false');
  buildLegend();
  buildFilters();
  applyFilters();                       /* re-renders list + counts, redraws map */
  if (state.sel) renderDetail(state.sel);
  else if (matchMedia('(min-width:880px)').matches) renderPlaceholder();
}
$('lgEn').onclick = () => applyLang('en');
$('lgPt').onclick = () => applyLang('pt');

/* ------------------------------------------------------------------ boot */
new ResizeObserver(resize).observe(canvas);
window.addEventListener('resize', resize);
applyLang(LANG);
syncOsm();
resize();
fit(false);
if (matchMedia('(min-width:880px)').matches) { $('sheet').classList.add('open'); }
</script>
</body>
</html>
